{{- if .Values.exporter.enabled }}
{{- $fipsMode := include "karta.fipsMode" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    {{- include "karta.exporter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.exporter.replicaCount }}
  selector:
    matchLabels:
      {{- include "karta.exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karta.exporter.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.exporter.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Roll the Pod when the config changes; the file is read once at startup.
        checksum/config: {{ include (print $.Template.BasePath "/exporter-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "karta.exporter.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: karta-metrics-exporter
          image: "{{ required "exporter.image.repository is required" .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - --config=/etc/karta-metrics-exporter/config.yaml
            - --metrics-bind-address=:{{ .Values.exporter.http.port }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.http.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          {{- if ne $fipsMode "off" }}
          env:
            - name: GODEBUG
              value: "fips140={{ $fipsMode }}"
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/karta-metrics-exporter
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "karta.exporter.fullname" . }}
{{- end }}
