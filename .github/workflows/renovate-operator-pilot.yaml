name: Renovate operator pilot

on:
  push:
    branches: [codex/e2e-renovate-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-operator-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'AviadHayumi/workload-map' && github.ref == 'refs/heads/codex/e2e-renovate-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      issues: read
    outputs:
      branch: ${{ steps.candidate.outputs.branch }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find the latest eligible release and update global.env
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: hack/e2e/renovate-pilot/config.cjs
          token: ${{ github.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.151.0@sha256:8a79148ec24cc05809782e20e720dafe9dde0c24a00f26e76d14dec2cbd74a53
          additional-env-list: |
            PILOT_BASE_BRANCH
            PILOT_RUN
        env:
          PILOT_BASE_BRANCH: ${{ github.ref_name }}
          PILOT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          LOG_LEVEL: debug

      - name: Resolve the exact Renovate commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          branch="codex/renovate-pilot/${PILOT_RUN}/jobset"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
          test "${#sha}" = 40
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  record:
    name: Record and replay JobSet
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CLUSTER_NAME: renovate-jobset
      PILOT_BASE_SHA: ${{ github.sha }}
      PILOT_CANDIDATE_SHA: ${{ needs.update.outputs.sha }}
      PILOT_BRANCH: ${{ needs.update.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.update.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Renovate changed only the reviewed JobSet pin
        run: |
          test "$(git diff --name-only "$PILOT_BASE_SHA" HEAD)" = hack/e2e/global.env
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          before = subprocess.check_output(['git', 'show', os.environ['PILOT_BASE_SHA'] + ':hack/e2e/global.env'], text=True)
          old = 'JOBSET_VERSION="${JOBSET_VERSION:-v0.10.1}"'
          new = 'JOBSET_VERSION="${JOBSET_VERSION:-v0.12.0}"'
          assert before.count(old) == 1
          assert pathlib.Path('hack/e2e/global.env').read_text() == before.replace(old, new)
          assert not pathlib.Path('test/e2e/recorded_data/jobset/v0.12.0').exists(), 'Recordings must be fresh'
          PY
          . ./hack/e2e/global.env
          {
            echo "KIND_VERSION=$KIND_VERSION"
            echo "KUBECTL_VERSION=$KUBECTL_VERSION"
            echo "HELM_VERSION=$HELM_VERSION"
            echo "JOBSET_VERSION=$JOBSET_VERSION"
            echo "KUBECONFIG=$HOME/.kube/kind-${CLUSTER_NAME}.kubeconfig"
          } >> "$GITHUB_ENV"
          mkdir -p .artifacts
          git diff "$PILOT_BASE_SHA" HEAD -- hack/e2e/global.env > .artifacts/renovate.patch
          cp hack/e2e/global.env .artifacts/global.env

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum
            test/e2e/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}

      - name: Provision a fresh kind cluster with the candidate operator
        run: make e2e-up WORKLOADS=jobset CLUSTER_NAME="$CLUSTER_NAME"

      - name: Verify the installed version and save provenance
        run: |
          grep -Fx "jobset=$JOBSET_VERSION" "hack/e2e/operators/.installed-versions-${CLUSTER_NAME}"
          image=$(kubectl -n jobset-system get deployment jobset-controller-manager -o jsonpath='{.spec.template.spec.containers[?(@.name=="manager")].image}')
          test "$image" = "registry.k8s.io/jobset/jobset:$JOBSET_VERSION"
          kubectl -n jobset-system get pods -l control-plane=controller-manager -o json |
            jq '[.items[].status.containerStatuses[] | select(.name == "manager") | {image, imageID, ready}] | if length > 0 and all(.[]; .ready and (.imageID | length > 0)) then . else error("No ready JobSet controller") end' > .artifacts/controller-images.json
          kubectl version -o json | jq '{serverVersion}' > .artifacts/kubernetes.json
          jq -n '{base: env.PILOT_BASE_SHA, candidate: env.PILOT_CANDIDATE_SHA, branch: env.PILOT_BRANCH, operator: "jobset", version: env.JOBSET_VERSION, run: ("https://github.com/" + env.GITHUB_REPOSITORY + "/actions/runs/" + env.GITHUB_RUN_ID)}' > .artifacts/provenance.json

      - name: Record all five JobSet flows
        run: make record-e2e WORKLOADS=jobset CLUSTER_NAME="$CLUSTER_NAME" E2E_TIMEOUT=15m E2E_JUNIT_REPORT="$GITHUB_WORKSPACE/.artifacts/jobset-junit.xml"

      - name: Validate fresh recordings and replay fixtures
        run: |
          cd test/e2e
          GOWORK=off go run ./cmd/verify-operator-pilot -expected-version "$JOBSET_VERSION" -junit "$GITHUB_WORKSPACE/.artifacts/jobset-junit.xml"
          cd ../..
          make verify-recordings test-replay
          tar -czf .artifacts/jobset-recordings.tar.gz "test/e2e/recorded_data/jobset/${JOBSET_VERSION}"
          printf 'JobSet %s: installation, five fresh recordings, and replay passed.\n\nRenovate branch: %s\n' "$JOBSET_VERSION" "$PILOT_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure()
        run: kind export logs .artifacts/kind --name "$CLUSTER_NAME" || true

      - name: Upload evidence and recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renovate-jobset-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Tear down the temporary cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME"
