{
  "apiVersion": "apps.nvidia.com/v1alpha1",
  "kind": "NIMCache",
  "metadata": {
    "name": "matrix-nimcache"
  },
  "spec": {
    "source": {
      "hf": {
        "endpoint": "https://huggingface.co",
        "namespace": "example",
        "authSecret": "matrix-hf-placeholder",
        "modelPuller": "karta-nimcache-cpu:matrix-v2",
        "pullSecret": "matrix-pull-placeholder",
        "modelName": "cpu-fixture"
      }
    },
    "storage": {
      "pvc": {
        "create": true,
        "size": "1Gi",
        "volumeAccessMode": "ReadWriteOnce"
      }
    },
    "resources": {
      "cpu": "50m",
      "memory": "32Mi"
    },
    "userID": 1000,
    "groupID": 1000,
    "nodeSelector": {
      "kubernetes.io/os": "linux"
    }
  }
}
