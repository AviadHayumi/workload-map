kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: apps-nvidia-com-nimcache-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: nimcache
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMCache
      specDefinition:
        fragmentedPodSpecDefinition:
          resources:
            read:
              expression: '{"requests": ([dyn(object[?"spec"][?"resources"].orValue(dyn(null)))].filter(v, type(v) == map) + [{}])[0]}'
      scaleDefinition:
        replicas:
          read:
            expression: "1"
      statusDefinition:
        phaseDefinition:
          read:
            expression: object[?"status"][?"state"].orValue(dyn(null))
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byPhase: Pending
            - byPhase: NotReady
            - byPhase: PVC-Created
            - byPhase: Started
            - byConditions:
                - type: NIM_CACHE_JOB_CREATED
                  status: "True"
          running:
            - byPhase: InProgress
          completed:
            - byPhase: Ready
              byConditions:
                - type: NIM_CACHE_JOB_COMPLETED
                  status: "True"
          failed:
            - byPhase: Failed
  optimizationInstructions: {}
