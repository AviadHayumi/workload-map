apiVersion: batch/v1
kind: Job
metadata:
  name: running-worker
  namespace: ai-lab
  labels:
    tutorial.karta.run.ai/test: "true"
    tutorial.karta.run.ai/action: suspend
spec:
  suspend: false
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.37.0
          command: [sh, -c, "sleep 86400"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
