operator:
  enabled: false
webhook:
  enabled: false
crdUpgrader:
  enabled: false
exporter:
  enabled: true
  image:
    repository: dsx-workload-exporter
    tag: kyverno-tutorial
    pullPolicy: Never
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ai-lab
    matchExpressions: []
  resourceRules:
    - apiGroups: [batch]
      apiVersions: [v1]
      resources: [jobs]
  requiredKinds: [batch/v1/Job]
  kartaDefinitionSource:
    catalog:
      enabled: true
      include: [batch-job-v1]
    cluster:
      enabled: false
  rbac:
    workloadRules:
      - apiGroups: [batch]
        resources: [jobs]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
