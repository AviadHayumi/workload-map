rule_files:
- kep-rules.yaml
evaluation_interval: 30s
tests:
- name: identical-exporter-replicas-do-not-double-usage
  interval: 30s
  input_series:
  - series: karta_pod_workload_info{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",pod_name="decode-0",pod_uid="p-d",replica_group_id="",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",team="alpha"}
    values: 1x20
  - series: karta_workload_status{karta="dynamo-definition",karta_source="catalog",namespace="team-a",owner_resolution="resolved",phase="Running",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",team="alpha"}
    values: 1x20
  - series: DCGM_FI_DEV_GPU_UTIL{UUID="gpu-a",namespace="team-a",pod="decode-0",pod_uid="p-d"}
    values: 1x20
  - series: container_cpu_usage_seconds_total{container="worker",namespace="team-a",pod="decode-0"}
    values: 100+6x20
  - series: container_memory_working_set_bytes{container="worker",namespace="team-a",pod="decode-0"}
    values: 536870912x20
  - series: karta_pod_workload_info{component="service",component_instance="decode",instance="second-exporter",namespace="team-a",owner_resolution="resolved",pod_name="decode-0",pod_uid="p-d",replica_group_id="",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",team="alpha"}
    values: 1x20
  - series: karta_workload_status{instance="second-exporter",karta="dynamo-definition",karta_source="catalog",namespace="team-a",owner_resolution="resolved",phase="Running",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",team="alpha"}
    values: 1x20
  promql_expr_test:
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload_name, workload_uid,
              owner_resolution, component, component_instance, replica_group_id, team) (
        label_replace(
          rate(container_cpu_usage_seconds_total{
            namespace!="", pod!="", container!="", container!="POD"
          }[5m]),
          "pod_name", "$1", "pod", "(.+)"
        )
        * on (namespace, pod_name)
          group_left (workload_group, workload_version, workload_kind, workload_name, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id, team)
          karta:pod_attribution:unique{observation_valid="true",component!="<unknown>",component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",team="alpha"}'
      value: 0.2
  - expr: |-
      (
        max by (namespace, workload_group, workload_version, workload_kind, workload_name, workload_uid,
                owner_resolution, component, component_instance, replica_group_id, team) (
          max_over_time(DCGM_FI_DEV_GPU_UTIL{namespace!="",pod_uid!=""}[5m])
          * on (namespace, pod_uid)
            group_left (workload_group, workload_version, workload_kind, workload_name, workload_uid,
                        owner_resolution, component, component_instance, replica_group_id, team)
            karta:pod_attribution:unique{observation_valid="true",component!="<unknown>",component_instance!="<unknown>"}
        ) < 5
      )
      and on (namespace, workload_uid)
        (min by (namespace, workload_uid) (
          karta_workload_status{phase="Running",observation_valid="true"}
        ) == 1)
      unless on (namespace, workload_uid)
        karta_workload_status{observation_valid="false"}
      unless on (namespace, workload_uid)
        (min_over_time(karta_exporter_observation_valid{scope="workload"}[5m]) == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",team="alpha"}'
      value: 1
