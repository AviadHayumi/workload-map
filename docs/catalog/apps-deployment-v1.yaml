kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: apps-deployment-v1
spec:
  structureDefinition:
    rootComponent:
      name: deployment
      kind:
        group: apps
        version: v1
        kind: Deployment
      specDefinition:
        podTemplateSpecPath: .spec.template
      scaleDefinition:
        replicasPath: .spec.replicas // 1
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and .status.observedGeneration != null
                      and .status.observedGeneration == .metadata.generation and .spec.paused != true
                      and (.spec.replicas // 1) > 0
                      and (.status.availableReplicas // 0) < (.spec.replicas // 1)
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and .status.observedGeneration != null
                      and .status.observedGeneration == .metadata.generation and .spec.paused != true
                      and ((.status.replicas // 0) != (.spec.replicas // 1)
                          or (.status.updatedReplicas // 0) < (.spec.replicas // 1)
                          or ((.status.availableReplicas // 0) < (.spec.replicas // 1)
                              and any(.status.conditions[]?; .type == "Progressing"
                                  and ((.status == "True" and .reason != "NewReplicaSetAvailable")
                                      or (.status == "False" and .reason == "ProgressDeadlineExceeded")))))
                expectedResult: "true"
          running:
            - byConditions:
                - type: Available
                  status: "True"
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and .status.observedGeneration != null
                      and .status.observedGeneration == .metadata.generation and (.spec.replicas // 1) > 0
                      and (.status.availableReplicas // 0) > 0
                expectedResult: "true"
          failed:
            - byConditions:
                - type: Progressing
                  status: "False"
                  reason: ProgressDeadlineExceeded
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and .status.observedGeneration != null
                      and .status.observedGeneration == .metadata.generation and .spec.paused != true
                expectedResult: "true"
    childComponents:
      - name: replicaset
        kind:
          group: apps
          version: v1
          kind: ReplicaSet
        ownerRef: deployment
  optimizationInstructions: {}
