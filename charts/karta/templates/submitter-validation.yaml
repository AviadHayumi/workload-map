{{- $submitterAdmission := .Values.submitterAdmission -}}
{{- if (dig "admission" "enabled" false .Values.exporter.attribution) }}
{{- fail "exporter.attribution.admission was replaced by submitterAdmission with native admission policies" }}
{{- end }}
{{- if .Values.operator.webhookOnly }}
{{- fail "operator.webhookOnly is no longer needed: submitterAdmission runs in the API server" }}
{{- end }}
{{- if $submitterAdmission.enabled }}
{{- if hasKey $submitterAdmission "identitySource" }}
{{- fail "submitterAdmission.identitySource is obsolete; native capture uses request.userInfo.username" }}
{{- end }}
{{- range $key := list "namespaceSelector" "resourceRules" }}
{{- if hasKey $submitterAdmission $key }}
{{- fail (printf "submitterAdmission.%s is obsolete; use submitterAdmission.matchConstraints for native matching" $key) }}
{{- end }}
{{- end }}
{{- if not $submitterAdmission.matchConstraints.resourceRules }}
{{- fail "submitterAdmission.matchConstraints.resourceRules must select namespaced CREATE requests" }}
{{- end }}
{{- range $rules := list $submitterAdmission.matchConstraints.resourceRules $submitterAdmission.matchConstraints.excludeResourceRules }}
{{- range $rule := $rules }}
{{- if or (ne (toJson $rule.operations) "[\"CREATE\"]") (ne $rule.scope "Namespaced") }}
{{- fail "submitterAdmission rules require operations: [CREATE] and scope: Namespaced" }}
{{- end }}
{{- end }}
{{- end }}
{{- if hasKey $submitterAdmission "matchConditions" }}
{{- $conditions := $submitterAdmission.matchConditions }}
{{- if not (kindIs "slice" $conditions) }}
{{- fail "submitter admission matchConditions must be a list" }}
{{- end }}
{{- if gt (len $conditions) 64 }}
{{- fail "submitter admission matchConditions must contain at most 64 entries" }}
{{- end }}
{{- $names := dict }}
{{- range $index, $condition := $conditions }}
{{- $path := printf "submitter admission matchConditions[%d]" $index }}
{{- if not (kindIs "map" $condition) }}
{{- fail (printf "%s must be an object with name and expression" $path) }}
{{- end }}
{{- if not (kindIs "string" $condition.name) }}
{{- fail (printf "%s.name must be a nonempty qualified name string" $path) }}
{{- end }}
{{- $parts := splitList "/" $condition.name }}
{{- $name := last $parts }}
{{- if or (gt (len $parts) 2) (gt (len $name) 63) (not (regexMatch "^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$" $name)) }}
{{- fail (printf "%s.name must be a nonempty qualified name string" $path) }}
{{- end }}
{{- if eq (len $parts) 2 }}
{{- $prefix := first $parts }}
{{- if or (gt (len $prefix) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $prefix)) }}
{{- fail (printf "%s.name must be a nonempty qualified name string" $path) }}
{{- end }}
{{- end }}
{{- if hasKey $names $condition.name }}
{{- fail (printf "%s.name must be unique: %s" $path $condition.name) }}
{{- end }}
{{- $_ := set $names $condition.name true }}
{{- if not (kindIs "string" $condition.expression) }}
{{- fail (printf "%s.expression must be a nonempty string" $path) }}
{{- end }}
{{- if eq (trim $condition.expression) "" }}
{{- fail (printf "%s.expression must be a nonempty string" $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
