{
  "apiVersion": "ray.io/v1",
  "kind": "RayService",
  "metadata": {
    "name": "matrix-rayservice"
  },
  "spec": {
    "rayClusterConfig": {
      "rayVersion": "2.40.0",
      "headGroupSpec": {
        "rayStartParams": {},
        "template": {
          "spec": {
            "containers": [
              {
                "name": "ray-head",
                "image": "ray-e2e:local",
                "imagePullPolicy": "IfNotPresent",
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "1Gi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "2Gi"
                  }
                },
                "readinessProbe": {
                  "tcpSocket": {
                    "port": 6379
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 5,
                  "failureThreshold": 30
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": 6379
                  },
                  "initialDelaySeconds": 30,
                  "periodSeconds": 10,
                  "failureThreshold": 30
                },
                "volumeMounts": [
                  {
                    "name": "app",
                    "mountPath": "/opt/matrix"
                  }
                ],
                "env": [
                  {
                    "name": "PYTHONPATH",
                    "value": "/opt/matrix"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "app",
                "configMap": {
                  "name": "matrix-ray-app"
                }
              }
            ]
          }
        }
      },
      "workerGroupSpecs": [
        {
          "rayStartParams": {},
          "template": {
            "spec": {
              "containers": [
                {
                  "name": "ray-worker",
                  "image": "ray-e2e:local",
                  "imagePullPolicy": "IfNotPresent",
                  "resources": {
                    "requests": {
                      "cpu": "250m",
                      "memory": "1Gi"
                    },
                    "limits": {
                      "cpu": "1",
                      "memory": "2Gi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "name": "app",
                      "mountPath": "/opt/matrix"
                    }
                  ],
                  "env": [
                    {
                      "name": "PYTHONPATH",
                      "value": "/opt/matrix"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "app",
                  "configMap": {
                    "name": "matrix-ray-app"
                  }
                }
              ]
            }
          },
          "groupName": "workers",
          "replicas": 1,
          "minReplicas": 1,
          "maxReplicas": 1
        }
      ]
    },
    "serveConfigV2": "applications:\n- deployments:\n  - name: Echo\n    num_replicas: 1\n    ray_actor_options:\n      num_cpus: 0.1\n  import_path: matrix_app:app\n  name: echo\n  route_prefix: /\n"
  }
}
