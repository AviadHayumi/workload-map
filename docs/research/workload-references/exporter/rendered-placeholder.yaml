---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karta-ref-exporter
  namespace: test-ref
  labels:
    helm.sh/chart: karta-0.0.0
    app.kubernetes.io/name: karta
    app.kubernetes.io/instance: karta-ref
    app.kubernetes.io/version: 0.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karta
      app.kubernetes.io/instance: karta-ref
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karta
        app.kubernetes.io/instance: karta-ref
        app.kubernetes.io/component: exporter
      annotations:
        checksum/config: 102133e5a8e04e600e363e905b525b16b8c662ae25f1e700a8daf272b7f638ce
    spec:
      serviceAccountName: karta-ref-exporter
      securityContext:
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: exporter
        image: example.invalid/karta-reference-exporter:01352db5
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/karta/exporter/config.json
        - --metrics-bind-address=:8080
        - --metrics-exporter=prometheus
        - --workload-phases=all
        volumeMounts:
        - name: config
          mountPath: /etc/karta/exporter
          readOnly: true
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: karta-ref-exporter-config
