{
  "apiVersion": "leaderworkerset.x-k8s.io/v1",
  "kind": "LeaderWorkerSet",
  "metadata": {
    "name": "matrix-lws"
  },
  "spec": {
    "replicas": 2,
    "leaderWorkerTemplate": {
      "size": 3,
      "leaderTemplate": {
        "spec": {
          "containers": [
            {
              "name": "leader",
              "image": "busybox:1.36",
              "command": [
                "sleep",
                "infinity"
              ],
              "resources": {
                "requests": {
                  "cpu": "50m",
                  "memory": "32Mi"
                }
              }
            }
          ]
        }
      },
      "workerTemplate": {
        "spec": {
          "containers": [
            {
              "name": "worker",
              "image": "busybox:1.36",
              "command": [
                "sleep",
                "infinity"
              ],
              "resources": {
                "requests": {
                  "cpu": "50m",
                  "memory": "32Mi"
                }
              }
            }
          ]
        }
      }
    }
  }
}
