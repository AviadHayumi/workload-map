{
  "apiVersion": "jobset.x-k8s.io/v1alpha2",
  "kind": "JobSet",
  "metadata": {
    "name": "matrix-jobset"
  },
  "spec": {
    "replicatedJobs": [
      {
        "name": "workers",
        "replicas": 2,
        "template": {
          "spec": {
            "parallelism": 1,
            "completions": 1,
            "backoffLimit": 0,
            "template": {
              "spec": {
                "restartPolicy": "Never",
                "containers": [
                  {
                    "name": "worker",
                    "image": "busybox:1.36",
                    "command": [
                      "true"
                    ],
                    "resources": {
                      "requests": {
                        "cpu": "50m",
                        "memory": "32Mi"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      },
      {
        "name": "chief",
        "replicas": 1,
        "template": {
          "spec": {
            "parallelism": 1,
            "completions": 1,
            "backoffLimit": 0,
            "template": {
              "spec": {
                "restartPolicy": "Never",
                "containers": [
                  {
                    "name": "worker",
                    "image": "busybox:1.36",
                    "command": [
                      "true"
                    ],
                    "resources": {
                      "requests": {
                        "cpu": "50m",
                        "memory": "32Mi"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      }
    ]
  }
}
