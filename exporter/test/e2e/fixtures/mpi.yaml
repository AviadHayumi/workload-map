{
  "apiVersion": "kubeflow.org/v2beta1",
  "kind": "MPIJob",
  "metadata": {
    "name": "matrix-mpi"
  },
  "spec": {
    "slotsPerWorker": 1,
    "runPolicy": {
      "cleanPodPolicy": "All"
    },
    "mpiReplicaSpecs": {
      "Launcher": {
        "replicas": 1,
        "template": {
          "spec": {
            "containers": [
              {
                "name": "mpi-launcher",
                "image": "busybox:1.36",
                "command": [
                  "sleep",
                  "600"
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "100m",
                    "memory": "64Mi"
                  }
                }
              }
            ]
          }
        }
      },
      "Worker": {
        "replicas": 2,
        "template": {
          "spec": {
            "containers": [
              {
                "name": "mpi-worker",
                "image": "busybox:1.36",
                "command": [
                  "sleep",
                  "infinity"
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "100m",
                    "memory": "64Mi"
                  }
                }
              }
            ]
          }
        }
      }
    }
  }
}
