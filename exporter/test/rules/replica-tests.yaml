        ) == 1)
      unless on (namespace, workload_uid)
        karta_workload_status{observation_valid="false"}
      unless on (namespace, workload_uid)
        (min_over_time(karta_exporter_observation_valid{scope="workload"}[5m]) == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",replica_group_id="0",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",submitted_by="alpha"}'
      value: 1
