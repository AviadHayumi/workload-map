{{- if and .Values.exporter .Values.exporter.enabled }}
{{- /* A null would drop the Karta RBAC while the exporter defaults the cluster source on. */}}
{{- if not (kindIs "bool" .Values.exporter.kartaDefinitionSource.cluster.enabled) }}
{{- fail "exporter.kartaDefinitionSource.cluster.enabled must be true or false" }}
{{- end }}
{{- $exporter := .Values.exporter }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    selection:
      {{- toYaml $exporter.selection | nindent 6 }}
    kartaDefinitionSource:
      {{- toYaml $exporter.kartaDefinitionSource | nindent 6 }}
    metrics:
      {{- toYaml $exporter.metrics | nindent 6 }}
    tuning:
      {{- omit $exporter.tuning "goMemoryLimit" "pprof" | toYaml | nindent 6 }}
{{- end }}
