{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "matrix-pod"
  },
  "spec": {
    "containers": [
      {
        "name": "worker",
        "image": "busybox:1.36",
        "command": [
          "sleep",
          "600"
        ],
        "resources": {
          "requests": {
            "cpu": "10m",
            "memory": "16Mi"
          }
        }
      }
    ],
    "terminationGracePeriodSeconds": 0
  }
}
