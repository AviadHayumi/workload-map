{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
data:
  config.json: {{ include "karta.exporter.config" . | quote }}
{{- end }}
