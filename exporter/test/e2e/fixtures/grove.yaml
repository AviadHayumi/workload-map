{
  "apiVersion": "grove.io/v1alpha1",
  "kind": "PodCliqueSet",
  "metadata": {
    "name": "matrix-grove"
  },
  "spec": {
    "replicas": 2,
    "template": {
      "cliques": [
        {
          "name": "worker",
          "spec": {
            "roleName": "worker",
            "replicas": 2,
            "podSpec": {
              "containers": [
                {
                  "name": "worker",
                  "image": "busybox:1.36",
                  "command": [
                    "/bin/sh",
                    "-c",
                    "echo grove-ok && sleep infinity"
                  ],
                  "resources": {
                    "requests": {
                      "cpu": "20m",
                      "memory": "32Mi"
                    }
                  }
                }
              ]
            }
          }
        }
      ]
    }
  }
}
