kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: core-pod-v1
spec:
  structureDefinition:
    rootComponent:
      name: pod
      kind:
        group: ""
        version: v1
        kind: Pod
      specDefinition:
        podTemplateSpec:
          read:
            expression: object
          write:
            path: ""
      scaleDefinition:
        replicas:
          read:
            expression: "1"
      statusDefinition:
        phaseDefinition:
          read:
            expression: object[?"status"][?"phase"].orValue(dyn(null))
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byPhase: Pending
          running:
            - byPhase: Running
          completed:
            - byPhase: Succeeded
          failed:
            - byPhase: Failed
  optimizationInstructions: {}
