kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: apps-deployment-v1
spec:
  variables:
    - name: specReplicas
      expression: ([dyn(object[?"spec"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
  structureDefinition:
    rootComponent:
      name: deployment
      kind:
        group: apps
        version: v1
        kind: Deployment
      specDefinition:
        podTemplateSpec:
          read:
            expression: object[?"spec"][?"template"].orValue(dyn(null))
          write:
            path: /spec/template
      scaleDefinition:
        replicas:
          read:
            expression: variables.specReplicas
          write:
            path: /spec/replicas
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byConditions:
                - type: Progressing
                  status: "True"
                  reason: NewReplicaSetCreated
            - byConditions:
                - type: Progressing
                  status: "True"
                - type: Available
                  status: "False"
          running:
            - byConditions:
                - type: Progressing
                  status: "True"
                  reason: NewReplicaSetAvailable
          failed:
            - byConditions:
                - type: Progressing
                  status: "False"
                  reason: ProgressDeadlineExceeded
    childComponents:
      - name: replicaset
        kind:
          group: apps
          version: v1
          kind: ReplicaSet
        ownerRef: deployment
  optimizationInstructions: {}
