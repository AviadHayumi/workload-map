{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    {{- include "karta.exporter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    {{- dict "labelRules" .Values.exporter.labelRules "labelLimits" .Values.exporter.labelLimits "resourceRules" .Values.exporter.resourceRules "excludeResourceRules" .Values.exporter.excludeResourceRules "namespaceSelector" .Values.exporter.namespaceSelector "objectSelector" .Values.exporter.objectSelector "podSelector" .Values.exporter.podSelector "kartaDefinitionSource" .Values.exporter.kartaDefinitionSource "ignoredOwnerKinds" .Values.exporter.ignoredOwnerKinds "requiredKinds" .Values.exporter.requiredKinds "workers" .Values.exporter.workers "leafWorkers" .Values.exporter.leafWorkers "rootWorkers" .Values.exporter.rootWorkers | toYaml | nindent 4 }}
{{- end }}
