</main><script>
const diagram=document.getElementById('diagram');
const buttons=[...document.querySelectorAll('[data-zoom]')];
const naturalWidth=2755.0;
for(const button of buttons){button.addEventListener('click',()=>{
 const mode=button.dataset.zoom;
 diagram.style.width=mode==='fit'?'100%':`${naturalWidth*Number(mode)}px`;
 for(const other of buttons)other.setAttribute('aria-pressed',String(other===button));
 document.getElementById('status').textContent=mode==='fit'?'Fit to width':'Scroll to follow the diagram';
});}
</script></body></html>
