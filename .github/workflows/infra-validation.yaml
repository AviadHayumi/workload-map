name: Infrastructure module validation

on:
  push:
    branches: [codex/infra-modules-validation]

permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure (${{ matrix.name }})
    if: github.repository == 'AviadHayumi/workload-map'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-infra
            workloads: grove
            cert_manager: 'true'
            webhook: cert-manager
          - name: base-only
            workloads: none
            cert_manager: 'false'
            webhook: disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
      - name: Record candidate commit
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD^ | tee .artifacts/candidate-commit.txt
          printf 'Candidate commit: `%s`\n' "$(cat .artifacts/candidate-commit.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned cluster tools
        run: |
          . ./hack/e2e/global.env
          mkdir -p "$RUNNER_TEMP/infra-tools"
          cd "$RUNNER_TEMP/infra-tools"
          curl -fsSL --retry 3 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o kind
          curl -fsSL --retry 3 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" -o kind.sha256
          printf '%s  kind\n' "$(awk '{print $1}' kind.sha256)" | sha256sum --check
          curl -fsSL --retry 3 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          curl -fsSL --retry 3 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          curl -fsSL --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tar.gz
          curl -fsSL --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" -o helm.sha256
          printf '%s  helm.tar.gz\n' "$(awk '{print $1}' helm.sha256)" | sha256sum --check
          tar -xzf helm.tar.gz
          sudo install -m 0755 kind kubectl /usr/local/bin/
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: Provision and smoke-test modules
        env:
          WORKLOADS: ${{ matrix.workloads }}
          CERT_MANAGER: ${{ matrix.cert_manager }}
          KARTA_WEBHOOK_MODE: ${{ matrix.webhook }}
        run: |
          set -o pipefail
          make e2e-up WORKLOADS="$WORKLOADS" 2>&1 | tee .artifacts/provision.log
          cp hack/e2e/operators/.installed-versions-karta-e2e .artifacts/installed-versions.txt
      - name: Verify modules again on the existing cluster
        env:
          CHECK_ALL: ${{ matrix.cert_manager }}
        run: |
          set -o pipefail
          if [ "$CHECK_ALL" = true ]; then
            bash hack/e2e/infra/cert-manager/verify.sh
            bash hack/e2e/infra/kai-scheduler/verify.sh
          fi
          bash hack/e2e/infra/fake-gpu-operator/verify.sh
      - name: Collect failure diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide > .artifacts/pods.txt || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > .artifacts/events.txt || true
          kind export logs .artifacts/kind --name karta-e2e || true
      - name: Tear down temporary cluster
        if: always()
        run: make e2e-down
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infra-validation-${{ matrix.name }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
