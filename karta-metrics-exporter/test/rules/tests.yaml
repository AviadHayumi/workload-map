rule_files:
- kep-rules.yaml
evaluation_interval: 30s
tests:
- name: cpu-and-memory-units
  interval: 30s
  input_series:
  - &id001
    series: karta_pod_workload_info{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",pod="decode-0",pod_uid="p-d",replica_group_id="",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}
    values: 1x20
  - &id002
    series: karta_workload_status{karta="dynamo-definition",karta_source="catalog",namespace="team-a",owner_resolution="resolved",phase="Running",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}
    values: 1x20
  - &id003
    series: karta_exporter_observation_healthy{group="nvidia.com",kind="DynamoGraphDeployment",namespace="team-a",reason="none",scope="workload",version="v1alpha1",workload="dynamo",workload_uid="w-d"}
    values: 1x20
  - &id004
    series: DCGM_FI_DEV_GPU_UTIL{UUID="gpu-a",namespace="team-a",pod="decode-0"}
    values: 1x20
  - &id005
    series: container_cpu_usage_seconds_total{container="worker",namespace="team-a",pod="decode-0"}
    values: 100+6x20
  - &id006
    series: container_memory_working_set_bytes{container="worker",namespace="team-a",pod="decode-0"}
    values: 536870912x20
  promql_expr_test:
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload, workload_uid,
              owner_resolution, component, component_instance, replica_group_id) (
        rate(container_cpu_usage_seconds_total{
          namespace!="", pod!="", container!="", container!="POD"
        }[5m])
        * on (namespace, pod)
          group_left (workload_group, workload_version, workload_kind, workload, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id)
          karta:pod_attribution:unique{component!="<unknown>", component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}'
      value: 0.2
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload, workload_uid,
              owner_resolution, component, component_instance, replica_group_id) (
        container_memory_working_set_bytes{namespace!="",pod!="",container!="",container!="POD"}
        * on (namespace, pod)
          group_left (workload_group, workload_version, workload_kind, workload, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id)
          karta:pod_attribution:unique{component!="<unknown>", component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}'
      value: 536870912
- name: sandbox-and-empty-container-excluded
  interval: 30s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - series: container_cpu_usage_seconds_total{container="POD",namespace="team-a",pod="decode-0"}
    values: 0+90x20
  - series: container_cpu_usage_seconds_total{container="",namespace="team-a",pod="decode-0"}
    values: 0+90x20
  - series: container_memory_working_set_bytes{container="POD",namespace="team-a",pod="decode-0"}
    values: 999999999x20
  promql_expr_test:
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload, workload_uid,
              owner_resolution, component, component_instance, replica_group_id) (
        rate(container_cpu_usage_seconds_total{
          namespace!="", pod!="", container!="", container!="POD"
        }[5m])
        * on (namespace, pod)
          group_left (workload_group, workload_version, workload_kind, workload, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id)
          karta:pod_attribution:unique{component!="<unknown>", component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}'
      value: 0.2
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload, workload_uid,
              owner_resolution, component, component_instance, replica_group_id) (
        container_memory_working_set_bytes{namespace!="",pod!="",container!="",container!="POD"}
        * on (namespace, pod)
          group_left (workload_group, workload_version, workload_kind, workload, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id)
          karta:pod_attribution:unique{component!="<unknown>", component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}'
      value: 536870912
- name: missing-gpu-is-absent-not-zero
  interval: 30s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id005
  - *id006
  promql_expr_test:
  - expr: |-
      (
        max by (namespace, workload_group, workload_version, workload_kind, workload, workload_uid,
                owner_resolution, component, component_instance, replica_group_id) (
          max_over_time(DCGM_FI_DEV_GPU_UTIL{namespace!="",pod!=""}[5m])
          * on (namespace, pod)
            group_left (workload_group, workload_version, workload_kind, workload, workload_uid,
                        owner_resolution, component, component_instance, replica_group_id)
            karta:pod_attribution:unique{component!="<unknown>",component_instance!="<unknown>"}
        ) < 5
      )
      and on (namespace, workload_uid)
        (min by (namespace, workload_uid) (karta_workload_status{phase="Running"}) == 1)
      and on (namespace, workload_uid)
        (min by (namespace, workload_uid) (
          min_over_time(karta_exporter_observation_healthy{scope="workload"}[5m])
        ) == 1)
    eval_time: 5m
    exp_samples: []
- name: failed-application-is-not-an-observation-failure
  interval: 30s
  input_series:
  - series: karta_workload_status{karta="dynamo-definition",karta_source="catalog",namespace="team-a",owner_resolution="resolved",phase="Failed",workload="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1"}
    values: 1x20
  - series: karta_exporter_observation_healthy{group="nvidia.com",kind="DynamoGraphDeployment",namespace="team-a",reason="none",scope="workload",version="v1alpha1",workload="dynamo",workload_uid="w-d"}
    values: 1x20
  promql_expr_test:
  - expr: min by (namespace, workload_uid) (karta_exporter_observation_healthy)
    eval_time: 5m
    exp_samples:
    - labels: '{namespace="team-a",workload_uid="w-d"}'
      value: 1
