kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: serving-kserve-io-llminferenceservice-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: llminferenceservice
      kind:
        group: serving.kserve.io
        version: v1alpha1
        kind: LLMInferenceService
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byExpression:
                expression: object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "Ready" && c.?status.orValue("") == "Unknown") && !(object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "PresetsCombined" && c.?status.orValue("") == "False"))
            - byExpression:
                expression: object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "Ready" && c.?status.orValue("") == "False" && (c.?reason.orValue("") in ["Progressing", "MinimumReplicasUnavailable", "WaitingForGateway", "GatewaysNotReady", "HTTPRoutesNotReady", "InferencePoolNotReady", "HPAProgressing", "ScaledObjectProgressing", "AllGroupsReady"]))
          running:
            - byConditions:
                - type: Ready
                  status: "True"
          failed:
            - byExpression:
                expression: object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "Ready" && c.?status.orValue("") == "False" && !(c.?reason.orValue("") in ["Progressing", "MinimumReplicasUnavailable", "WaitingForGateway", "GatewaysNotReady", "HTTPRoutesNotReady", "InferencePoolNotReady", "HPAProgressing", "ScaledObjectProgressing", "AllGroupsReady", "Stopped"]))
            - byExpression:
                expression: object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "Ready" && c.?status.orValue("") == "Unknown") && (object.?status.?conditions.orValue([]).exists(c, c.?type.orValue("") == "PresetsCombined" && c.?status.orValue("") == "False" && c.?reason.orValue("") != "Stopped"))
          suspended:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: Stopped
            - byConditions:
                - type: PresetsCombined
                  status: "False"
                  reason: Stopped
    childComponents:
      - name: main
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"template"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              path: /spec/template
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              path: /spec/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              path: /spec/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) == null
              path: /spec/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload
      - name: prefill
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"prefill"][?"template"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              path: /spec/prefill/template
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"prefill"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              path: /spec/prefill/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              path: /spec/prefill/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) == null
              path: /spec/prefill/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload-prefill
      - name: worker
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              expression: object[?"spec"][?"worker"].orValue(dyn(null))
            write:
              path: /spec/worker
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload-worker
      - name: leader
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"template"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/template
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"worker"].orValue(dyn(null)) != null
              path: /spec/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload-leader
      - name: prefill-leader
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"template"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/template
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload-leader-prefill
      - name: prefill-worker
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              expression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null))
            write:
              path: /spec/prefill/worker
        scaleDefinition:
          replicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"replicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/replicas
          minReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"minReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/scaling/minReplicas
          maxReplicas:
            read:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              expression: object[?"spec"][?"prefill"][?"scaling"][?"maxReplicas"].orValue(dyn(null))
            write:
              matchExpression: object[?"spec"][?"prefill"][?"worker"].orValue(dyn(null)) != null
              path: /spec/prefill/scaling/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-workload-worker-prefill
      - name: router-scheduler
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpec:
            read:
              expression: object[?"spec"][?"router"][?"scheduler"][?"template"].orValue(dyn(null))
            write:
              path: /spec/router/scheduler/template
        scaleDefinition:
          replicas:
            read:
              expression: object[?"spec"][?"router"][?"scheduler"][?"replicas"].orValue(dyn(null))
            write:
              path: /spec/router/scheduler/replicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"app.kubernetes.io/component"].orValue(dyn(null))
            value: llminferenceservice-router-scheduler
    additionalChildKinds:
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
      - group: inference.networking.k8s.io
        version: v1
        kind: InferencePool
      - group: gateway.networking.k8s.io
        version: v1
        kind: HTTPRoute
      - group: ""
        version: v1
        kind: Service
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: main
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
            - componentName: prefill
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
            - componentName: worker
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
                - object[?"metadata"][?"labels"][?"leaderworkerset.sigs.k8s.io/group-index"].orValue("0")
            - componentName: leader
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
                - object[?"metadata"][?"labels"][?"leaderworkerset.sigs.k8s.io/group-index"].orValue("0")
            - componentName: prefill-leader
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
                - object[?"metadata"][?"labels"][?"leaderworkerset.sigs.k8s.io/group-index"].orValue("0")
            - componentName: prefill-worker
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
                - object[?"metadata"][?"labels"][?"leaderworkerset.sigs.k8s.io/group-index"].orValue("0")
            - componentName: router-scheduler
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
