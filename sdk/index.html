hole workload from one Pod","lead":"Create one discoverer. Start with a Pod. Get the terminal workload, all its Pods and their Karta coordinates.","why":"A Pod event identifies one member. Inventory, metrics and integration code usually need its siblings and the workload that owns them.","sections":[{"title":"Create once, then reuse","paragraphs":["These statements belong inside a function returning error. kube is your dynamic.Interface; restMapper is your meta.RESTMapper. Imports use github.com/dsx-ai-factory/workload-map/pkg/karta, pkg/discovery and pkg/discovery/clientgo."],"bullets":["Construction starts no watches and performs no Kubernetes reads.","MaxDepth limits controller-owner hops. Omitting it selects 32.","Your application owns the client, event loop and output writes."],"code":"reader, err := clientgo.NewReader(kube, restMapper)\nif err != nil { return err }\n\nsdk, err := karta.NewDiscoverer(reader, discovery.Options{\n    MaxDepth: 32,\n})\nif err != nil { return err }","language":"go"},{"title":"Acquire the workload","paragraphs":["pod is the current *corev1.Pod read by your worker. PodReference includes its UID, so a same-name replacement cannot silently become this query's input."],"bullets":[],"code":"observed, err := sdk.WorkloadForPod(ctx, discovery.PodReference(pod))\nif err != nil { return err }\n\nroot := observed.Root()\npods := observed.Pods()\nfmt.Printf(\"workload=%s/%s pods=%d\\n\",\n    root.GVK.Kind, root.Name, len(pods))","language":"go"},{"title":"What this returns","paragraphs":["For the executable JobSet fixture, starting at training-0-pod returns JobSet/training-set and all three Pods."],"bullets":["Root(): kind, namespace, name and UID of the terminal workload.","Object(): a detached copy of the complete workload object.","Pods(): complete Pod copies, including completed, terminating and unscheduled Pods.","PodMemberships(): captured component coordinates and issues, keyed by Pod UID.","Accessors make no Kubernetes reads. Acquire again when you need newer data."],"code":"JobSet training-set\n  Job evaluation-0 -> Pod evaluation-0-pod\n  Job training-0   -> Pod training-0-pod\n  Job training-1   -> Pod training-1-pod","language":"text"},{"title":"Already know the workload?","paragraphs":["Call sdk.Workload(ctx, rootRef) using its exact GVK, namespace, name and current UID. This also returns a successful observation for a zero-Pod workload. An intermediate owner is not accepted as a terminal root."],"bullets":[]},{"title":"Try the read-only command","paragraphs":["The complete command example includes client construction and kubeconfig handling. Use a context you choose."],"bullets":[],"code":"go run ./examples/workloadinterface/cmd/inspect \\\n  -kubeconfig /path/to/kubeconfig -context your-context \\\n  -namespace team -pod training-0-pod","language":"bash"}],"source":[{"path":"pkg/karta/discovery.go","line":12},{"path":"pkg/discovery/resolver.go","line":166},{"path":"examples/workloadinterface/README.md","line":27},{"path":"examples/workloadinterface/cmd/inspect/main.go","line":1}]},{"id":"scopes","title":"Select components, instances and replicas","lead":"Start with the complete workload. Narrow to the exact group of actual Pods you need.","why":"A replica key only has meaning inside its component and instance. Scoped queries preserve that context, so training replica 0 cannot include evaluation replica 0.","sections":[{"title":"Read the grouping first","paragraphs":["This is the observed Pod grouping, built from PodMemberships(). It is separate from the declared template tree."],"bullets":[],"code":"JobSet training-set\n  component: replicatedjob\n    instance: evaluation\n      replica: \"0\" -> evaluation-0-pod\n    instance: training\n      replica: \"0\" -> training-0-pod\n      replica: \"1\" -> training-1-pod","language":"text"},{"title":"Follow one branch","paragraphs":[],"bullets":["replicatedjob is the component: a repeated Job template.","training is the named instance: an entry in spec.replicatedJobs.","\"0\" is the replica key: the Job index within that instance."],"code":"jobs, err := observed.Component(\"replicatedjob\")\nif err != nil { return err }\ntraining, err := jobs.Instance(\"training\")\nif err != nil { return err }\nfirstJob, err := training.Replica(\"0\")\nif err != nil { return err }\npods, err := firstJob.Pods()\nif err != nil { return err }\nfmt.Printf(\"training replica 0: %d Pods\\n\", len(pods))","language":"go"},{"title":"Expected selection","paragraphs":["The fixture uses Job parallelism 1. A Job replica can have multiple Pods when parallelism is greater."],"bullets":["Whole workload: evaluation-0-pod, training-0-pod, training-1-pod.","Component(\"replicatedjob\"): the same three Pods.","Instance(\"training\"): training-0-pod and training-1-pod.","Training Replica(\"0\"): training-0-pod.","Evaluation Replica(\"0\"): evaluation-0-pod.","Component selection includes descendant components. These queries make no Kubernetes calls."]},{"title":"Select an inference group","paragraphs":["For LeaderWorkerSet, the group component has one anonymous instance. Its replica key is the operator's group ID. This example returns inference-0-1; choosing leader returns inference-0."],"bullets":[],"code":"groups, err := observed.Component(\"group\")\nif err != nil { return err }\nfirstGroup, err := groups.Replica(\"0\")\nif err != nil { return err }\nworkers, err := firstGroup.Component(\"worker\")\nif err != nil { return err }\nworkerPods, err := workers.Pods()\nif err != nil { return err }","language":"go"},{"title":"Build your own view","paragraphs":["PodMemberships() supplies captured coordinates by Pod UID. A UI can render the grouping from those coordinates without reevaluating selectors."],"bullets":["Replica keys must be supplied by the consumer; replica-key enumeration is not implemented.","There is no observed.Tree() method returning this actual-Pod grouping.","Check membership issues before presenting a complete breakdown."]}],"source":[{"path":"examples/workloadinterface/README.md","line":176},{"path":"examples/workloadinterface/traversal_test.go","line":22},{"path":"examples/workloadinterface/traversal_test.go","line":80},{"path":"pkg/discovery/scope.go","line":1}]},{"id":"definitions","title":"Use known and unfamiliar workload kinds","lead":"Ownership discovery works without a Karta definition. A selected definition adds workload-specific interpretation.","why":"You can keep complete inventory for unfamiliar operators while using richer components, templates and status where definitions exist.","sections":[{"title":"Three distinct outcomes","paragraphs":[],"bullets":["Matching definition: the same workload and full Pod set, plus defined component coordinates.","No selected definition: Generic() is true; all confirmed Pods belong to one anonymous pods component.","Provider error: the query fails. An unavailable source is not confirmed absence."]},{"title":"Inspect the returned mode","paragraphs":["Continue using the same root and Pod methods in either mode. This snippet follows a successful WorkloadForPod call."],"bullets":[],"code":"fmt.Printf(\"kind=%s generic=%t pods=%d\\n\",\n    observed.Root().GVK.Kind, observed.Generic(), len(observed.Pods()))\n\nif observed.Generic() {\n    generic, err := observed.Component(\"pods\")\n    if err != nil { return err }\n    pods, err := generic.Pods()\n    if err != nil { return err }\n    fmt.Printf(\"generic component: %d Pods\\n\", len(pods))\n}","language":"go"},{"title":"What generic does not infer","paragraphs":["No matching definition does not mean unknown ownership. The workload remains the terminal controller owner."],"bullets":["DesiredTree and semantic edits are unsupported without a definition.","A definition for a child kind does not move the selected root to that child.","Missing owners, denied reads and invalid ownership are errors, not generic or empty results."]},{"title":"Keep confirmed Pods when classification is incomplete","paragraphs":["Pods() retains ownership-confirmed Pods even when semantic coordinates are unresolved. Read MembershipIssues() or each membership's Issues. A relevant scoped query returns ErrIncompleteAttribution instead of pretending that no Pods match."],"bullets":[]}],"source":[{"path":"pkg/discovery/workload.go","line":44},{"path":"pkg/discovery/definitions.go","line":25},{"path":"examples/workloadinterface/README.md","line":441},{"path":"examples/workloadinterface/recipes_test.go","line":74}]},{"id":"desired-tree","title":"Read declared templates, scale and status","lead":"DesiredTree describes what the workload declares. Scoped Pods queries describe what has been observed.","why":"A desired replica count and a running Pod count answer different questions. Keeping them separate avoids treating templates as actual Pods.","sections":[{"title":"The declared JobSet tree","paragraphs":["The root is included. Each component has instances; each instance has child components."],"bullets":[],"code":"component: jobset\n  instance: anonymous\n    component: replicatedjob\n      instance: evaluation   scale.replicas: 1\n      instance: training     scale.replicas: 2","language":"text"},{"title":"Read and traverse","paragraphs":["Run this after acquiring a known workload. Scale and status fields can be absent when the definition does not provide them."],"bullets":[],"code":"desired, err := observed.DesiredTree(ctx)\nif err != nil { return err }\n\nvar visit func(karta.ComponentNode, string)\nvisit = func(component karta.ComponentNode, indent string) {\n    fmt.Printf(\"%scomponent: %s\\n\", indent, component.Name)\n    for _, instance := range component.Instances {\n        name := \"anonymous\"\n        if instance.InstanceKey != nil { name = *instance.InstanceKey }\n        fmt.Printf(\"%s  instance: %s\\n\", indent, name)\n        for _, child := range instance.Children {\n            visit(child, indent + \"    \")\n        }\n    }\n}\nif desired.Root != nil { visit(*desired.Root, \"\") }","language":"go"},{"title":"Read status without inventing precedence","paragraphs":[],"bullets":["desired.Status.Phases contains all matched definition phases.","desired.RootStatus retains raw root conditions.","The fixture reports [Running] and Completed=False.","The consumer decides its product status precedence and resource accounting."]},{"title":"Existing Tree callers","paragraphs":["karta.New(definition, object), followed by workload.Tree(ctx), remains the offline entry point. The declared tree does not expand scale into runtime replicas and contains no actual Pods."],"bullets":["Root and RootStatus were added while Children and Status remain.","Children is the first root instance's child view; Instances() walks that view and excludes the root.","Positional struct literals or serialization consumers must account for added fields.","Child definitions are extracted globally and can appear beneath multiple parent instances. Do not sum every appearance as a separate resource.","Tree reads templates, scale and root status together. A selective or status-only consumer can keep separate component reads."]}],"source":[{"path":"pkg/tree/tree.go","line":15},{"path":"examples/workloadinterface/README.md","line":108},{"path":"examples/workloadinterface/traversal_test.go","line":22}]},{"id":"edit","title":"Edit a selected template on a local copy","lead":"Create an editor from a known workload. Change exactly the supported field and named instance you intend.","why":"A controller can prepare a consistent mutation without changing the captured observation or writing to Kubernetes until it is ready.","sections":[{"title":"Change only training","paragraphs":["The executable example verifies that evaluation is unchanged and the earlier observation still has its original templates."],"bullets":[],"code":"editor, err := karta.New(observed.Definition(), observed.Object())\nif err != nil { return err }\n\nerr = editor.UpdatePodTemplate(ctx, \"replicatedjob\", karta.Patch{\n    \"spec\": map[string]any{\"schedulerName\": \"example-scheduler\"},\n}, karta.WithInstances(\"training\"))\nif err != nil { return err }\n\nupdated, err := editor.Object()\nif err != nil { return err }\n// Persist updated through your client and handle update conflicts.","language":"go"},{"title":"Start from an object you already have","paragraphs":["Skip discovery when your controller already has the complete object and selected definition. karta.New accepts supported typed Kubernetes objects and unstructured objects with their exact GVK set."],"bullets":[],"code":"definition, err := catalog.Get(input.GroupVersionKind())\nif err != nil { return err }\neditor, err := karta.New(definition, input)\nif err != nil { return err }","language":"go"},{"title":"Check capabilities, then suspend or resume","paragraphs":["Components() reports supported writable fields and suspend actions. Use only capabilities supplied by the selected definition."],"bullets":[],"code":"for _, component := range editor.Components() {\n    fmt.Printf(\"component=%s suspendable=%t\\n\",\n        component.Name, component.Suspendable)\n}\nif err := editor.Suspend(ctx); err != nil { return err }\nsuspended, err := editor.Object()\nif err != nil { return err }\n// Persist suspended if this is your intended action.","language":"go"},{"title":"Mutation contract","paragraphs":[],"bullets":["Updates affect a mutable local copy. Only your explicit client write changes the cluster.","Resume(ctx) applies the definition's resume actions to that local copy.","Named targeting requires the instance IDs and written paths to share one writable iteration base. Unsupported layouts return karta.ErrNotSupported.","Unsupported edits return karta.ErrNotSupported.","A failed edit leaves the local copy unchanged.","Serialize access to the editor; it is not an immutable observation.","Kubernetes validation and update conflicts still apply when you persist the result."]}],"source":[{"path":"examples/workloadinterface/traversal_test.go","line":135},{"path":"examples/workloadinterface/recipes_test.go","line":114},{"path":"pkg/karta/workload.go","line":44},{"path":"examples/workloadinterface/README.md","line":342}]},{"id":"ownership","title":"Read only the physical owner chain","lead":"Use OwnershipPath when you need Pod -> Job -> JobSet, without sibling collection or component interpretation.","why":"An existing inventory builder often already knows its eligible Pods. Reading only their owners avoids repeating complete workload acquisition.","sections":[{"title":"The high-level path query","paragraphs":["The returned identities are input-first and terminal-root-last. This does not include labels or annotations."],"bullets":[],"code":"path, err := sdk.OwnershipPath(ctx, discovery.PodReference(pod))\nif err != nil { return err }\nfor _, object := range path {\n    fmt.Printf(\"%s/%s\\n\", object.GVK.Kind, object.Name)\n}","language":"go"},{"title":"Expected path","paragraphs":[],"bullets":[],"code":"Pod/training-0-pod\nJob/training-0\nJobSet/training-set","language":"text"},{"title":"Reuse an existing metadata cache","paragraphs":["Lower-level ownership.Trace accepts an ownership.Object, your ownership.Lookup function and an explicit maximum hop count. TraceRoot uses the same strict traversal when you only need the terminal reference."],"bullets":[],"code":"path, err := ownership.Trace(ctx, start, readOwner, maxHops)\nif err != nil { return err }\n// Convert verified objects into your existing inventory tree.","language":"go"},{"title":"Depth is a limit, not a workload boundary","paragraphs":[],"bullets":["At the high-level constructor, MaxDepth=0 selects 32 hops.","At the lower-level Trace/TraceRoot call, maxHops=0 permits no owner hops.","Exceeding the limit returns an error. It does not turn a child into the workload root.","Unknown kinds can participate when the caller can map and read them. No definition is required."]},{"title":"Parent cutoff remains a proposal","paragraphs":["The high-level discoverer does not yet expose an ignored-parent constructor option. A terminal orchestration object remains the workload even when a child has a known definition."],"bullets":["An explicit query for that child returns ErrNotWorkloadRoot.","The proposed cutoff would stop before selected exact parent GVKs; it needs consistent direct, indexed and cached behavior.","The exporter's existing lower-level ignored-owner/candidate policy is different. It must not be presented as this high-level API."]}],"source":[{"path":"pkg/discovery/resolver.go","line":128},{"path":"pkg/ownership/trace.go","line":101},{"path":"examples/workloadinterface/README.md","line":270},{"path":"examples/workloadinterface/INTEGRATION.md","line":570}]},{"id":"clients","title":"Choose the client and coverage you own","lead":"The SDK accepts a small Reader interface. Your operator chooses direct API reads, an existing cache or a caller-fed index.","why":"Consumers can retain their framework and client lifecycle instead of inheriting a second controller-runtime stack.","sections":[{"title":"Use the shipped client-go adapter","paragraphs":["Pass your dynamic client and REST mapper. A complete command example constructs both."],"bullets":[],"code":"reader, err := clientgo.NewReader(kube, restMapper)\nif err != nil { return err }\nsdk, err := karta.NewDiscoverer(reader, discovery.Options{})\nif err != nil { return err }","language":"go"},{"title":"Adapt another reader","paragraphs":["These are the actual discovery.Reader methods. A consumer-side controller-runtime adapter can implement them using that consumer's chosen version."],"bullets":[],"code":"type Reader interface {\n    Mapping(context.Context, schema.GroupVersionKind) (*meta.RESTMapping, error)\n    Get(context.Context, discovery.ObjectRef) (*unstructured.Unstructured, error)\n    ListPods(context.Context, string) (*corev1.PodList, error)\n}","language":"go"},{"title":"Coverage is part of the contract","paragraphs":[],"bullets":["ListPods includes all Pods in the requested namespace, across all phases. Empty namespace means all namespaces.","Direct lists must read every API page. Cached lists must return the complete cached set.","The reader must supply readable owner chains and objects detached from mutable cache storage.","A cache must reject queries before its declared scope is ready.","A scheduler-filtered Pod cache cannot claim complete workload membership. Use an unfiltered reader, then filter the result.","For existing selected membership, call attribution.Prepare/Evaluate only for classification instead."]},{"title":"Understand acquisition cost","paragraphs":["Direct WorkloadForPod collects Pod coverage for the workload namespace. It is not an indexed point lookup. A concrete discovery.Index captures one published local generation. Direct API reads are not a cross-resource transaction."],"bullets":["Karta integration contracts do not require controller-runtime types.","Kubernetes API machinery and client-go module versions still must be compatible.","A manager client can bypass its cache for unstructured objects. Choose an API reader or cache adapter explicitly."]}],"source":[{"path":"pkg/discovery/reader.go","line":25},{"path":"examples/workloadinterface/OPERATORS.md","line":265},{"path":"pkg/discovery/clientgo/reader.go","line":1}]},{"id":"cache","title":"Enable bounded attribution reuse","lead":"Use a populated discovery.Index for frequent workload queries. Optionally reuse derived attribution with explicit limits.","why":"An index avoids repeatedly collecting a namespace. Attribution reuse avoids recomputing eligible unchanged memberships on top of that index.","sections":[{"title":"Publish the initial complete view","paragraphs":["namespace is the intended inventory scope. Pass explicit zero-Pod root references after it when they must also be included. Close the gap between collection and your watch feed."],"bullets":[],"code":"dataset, err := discovery.Collect(ctx, reader, namespace)\nif err != nil { return err }\nindex := discovery.NewIndex()\ngeneration, err := index.Replace(ctx, dataset)\nif err != nil { return err }\n\nsdk, err := karta.NewDiscoverer(index, discovery.Options{\n    Cache: &discovery.CacheOptions{\n        MaxWorkloads: 1000,\n        MaxPods: 10000,\n    },\n})\nif err != nil { return err }","language":"go"},{"title":"Feed current objects from your serialized publisher","paragraphs":["changes is a discovery.Changes batch of current Upserts, UID-specific Deletes and any required mappings. Re-read your canonical cache after a generation conflict."],"bullets":[],"code":"generation, err = index.Apply(ctx, generation, changes)\nif err != nil { return err }","language":"go"},{"title":"What is cached","paragraphs":[],"bullets":["Cache is disabled when omitted. Only a concrete non-nil *discovery.Index supports it.","Both limits must be positive. They bound retained attribution entries and Pod membership records, not process bytes.","It does not cache HTTP requests, start informers or bound the underlying index.","Changed indexed inputs or compiled definitions prevent stale attribution reuse on the next query.","Unsupported expression plans and failed attribution use the uncached path.","Correctly published changes need no manual cache flush. Missed events still require recovery."]},{"title":"Recover from a lost feed","paragraphs":["If watch coverage or ordering is lost, call index.Invalidate(cause), then rebuild with a complete Replace. The SDK cannot repair stale input data. Keep initial collection and later publications ordered."],"bullets":[]},{"title":"Earlier observations stay unchanged","paragraphs":["The executable cache example publishes a Pod phase change. A new observation reports Succeeded while the prior observation still reports Running. Returned objects remain detached copies."],"bullets":[],"code":"go test ./examples/workloadinterface \\\n  -run '^ExamplePodSource_attributionCache$' -v","language":"bash"}],"source":[{"path":"pkg/discovery/index.go","line":24},{"path":"pkg/discovery/index.go","line":114},{"path":"pkg/discovery/index.go","line":170},{"path":"pkg/discovery/resolver.go","line":38},{"path":"examples/workloadinterface/recipes_test.go","line":156}]},{"id":"operator","title":"Wire Pod events into your operator","lead":"Your watcher queues a key. Your worker reads the current object, calls Karta and publishes your existing output.","why":"Keeping lifecycle in the consumer makes retries, deletion, ordering and persistence explicit. The SDK is an ordinary library call inside that flow.","sections":[{"title":"The normal path","paragraphs":[],"bullets":[],"code":"Pod Add/Update -> your queue -> read current Pod\n  -> sdk.WorkloadForPod -> convert returned workload\n  -> write your inventory or integration record","language":"text"},{"title":"Call from reconciliation","paragraphs":["This fragment belongs in your worker after its current Pod read. Your output conversion and write remain outside the SDK."],"bullets":[],"code":"observed, err := sdk.WorkloadForPod(ctx, discovery.PodReference(pod))\nif err != nil { return err }\n\nfmt.Printf(\"root=%s generic=%t pods=%d\\n\",\n    observed.Root().Name, observed.Generic(), len(observed.Pods()))\nfor uid, member := range observed.PodMemberships() {\n    fmt.Printf(\"pod=%s component=%s path=%v issues=%v\\n\",\n        uid, member.Component, member.Path, member.Issues)\n}","language":"go"},{"title":"Deletion and reparenting","paragraphs":[],"bullets":["A deleted Pod cannot be rediscovered by WorkloadForPod. Keep a Pod UID -> workload reference association.","When a Pod disappears, refresh its former workload with sdk.Workload.","When a Pod moves to another owner, refresh both the former and new workload.","A missing intermediate owner is not proof that the workload itself was deleted.","Read failures leave the previous output intact until your retry or authoritative deletion handling resolves them."]},{"title":"Readiness and concurrent workers","paragraphs":[],"bullets":["Wait for complete reader coverage and initial definition publication before publishing inventory.","Event-handler synchronization alone does not mean queued work has been processed.","With concurrent Pod workers, enqueue root identities into one serialized root reconciliation path.","That root worker acquires sdk.Workload and publishes the result in the same serialized operation.","Pod, owner and definition events feed that root queue. A write lock alone cannot prevent an older observation overwriting a newer one."]},{"title":"Executable wiring","paragraphs":["The operator example uses real client-go handler and queue types with fixture events. It demonstrates two Pod events producing one workload record containing all three JobSet Pods. It does not claim to run a live controller."],"bullets":[],"code":"go test ./examples/workloadinterface \\\n  -run '^ExamplePodReconciler$' -v","language":"bash"}],"source":[{"path":"examples/workloadinterface/OPERATORS.md","line":21},{"path":"examples/workloadinterface/operator.go","line":18},{"path":"examples/workloadinterface/operator_test.go","line":1}]},{"id":"live-definitions","title":"Select and update definitions","lead":"Publish the complete set of definitions your operator chooses. Keep watches and selection policy in the operator.","why":"A live provider lets one SDK instance observe changed definitions without rebuilding its client or hiding precedence rules.","sections":[{"title":"Select one catalog definition","paragraphs":["This registry is authoritative: kinds omitted from it are generic. Without DefinitionProvider, static Definitions instead override the full built-in catalog. Do not supply both options."],"bullets":[],"code":"jobSet, err := catalog.Get(schema.GroupVersionKind{\n    Group: \"jobset.x-k8s.io\", Version: \"v1alpha2\", Kind: \"JobSet\",\n})\nif err != nil { return err }\ndefinitions, err := discovery.NewDefinitionRegistry(jobSet)\nif err != nil { return err }\n\nsdk, err := karta.NewDiscoverer(reader, discovery.Options{\n    DefinitionProvider: definitions,\n    MaxDepth: 32,\n})\nif err != nil { return err }","language":"go"},{"title":"Publish a change through your watcher","paragraphs":["selected is the complete current []*v1alpha1.Karta selection, including selected catalog entries you still want. Replace validates before publication; an invalid set returns an error and retains the last valid selection."],"bullets":[],"code":"if err := definitions.Replace(selected...); err != nil {\n    return err\n}\n// Enqueue affected workload roots through your existing root queue.","language":"go"},{"title":"Watch-to-query flow","paragraphs":[],"bullets":[],"code":"Karta Add/Update/Delete -> your definition queue\n  -> read the complete synchronized selection\n  -> definitions.Replace(selected...)\n  -> enqueue affected roots\n  -> sdk.Workload -> convert and publish","language":"text"},{"title":"Selection and failure rules","paragraphs":[],"bullets":["The registry has no implicit catalog-versus-cluster precedence rule. Supply your already selected set.","Omitted definitions are removed. Publishing only watched objects also removes catalog entries not included.","Gate workers before the first successful publication from an external source.","An intentionally empty synchronized selection means generic discovery. An unavailable source must remain an error.","Serialize source selection and publication. Resource versions are opaque, not sortable numbers.","Replacing definitions does not install CRDs, grant read permissions or start workload watches."]},{"title":"Supply another provider","paragraphs":["Compile at publication with discovery.CompileDefinition. Reuse its immutable handle until the full definition changes; the built-in registry already does this."],"bullets":[],"code":"type DefinitionProvider interface {\n    Definition(context.Context, schema.GroupVersionKind) (*discovery.Definition, error)\n}","language":"go"},{"title":"Provider return values","paragraphs":[],"bullets":["A non-nil definition supplies the selected exact-GVK interpretation.","nil, nil confirms no selected definition.","An error fails the observation instead of silently returning generic.","Metadata or status changes can change handle identity, even when spec is unchanged. Compare handles across old and new GVK sets when narrowing requeues."]}],"source":[{"path":"pkg/discovery/definitions.go","line":25},{"path":"examples/workloadinterface/OPERATORS.md","line":144},{"path":"examples/workloadinterface/definition_selection.go","line":1}]},{"id":"wld","title":"Replace the WLD owner walker","lead":"The first k8s-workload-discovery adapter shares strict owner traversal while keeping WLD's watches, metadata and physical output tree.","why":"WLD already selects eligible Pods and merges owner paths. Replacing that one algorithm preserves its inventory contract without requiring full SDK discovery.","sections":[{"title":"Before","paragraphs":["The inspected binary uses WorkloadTreeReconciler. A new Pod may require an owner walk while mapping the Workload key. WLD also watches Workload rebuilds and selected root metadata; optional DRA filtering adds ResourceClaim events."],"bullets":[],"code":"Pod event -> map Workload key -> WLD queue\n  -> cached Workload and eligible Pods\n  -> WLD owner-walking loop\n  -> merge physical paths -> write Workload\n  -> separate status controller","language":"text"},{"title":"After phase 1","paragraphs":["Inside OwnerWalker.WalkPod, the adapter retains fetched metadata in readOwner, asks Karta to validate traversal, then converts the verified path into the same WLD tree."],"bullets":[],"code":"_, err := ownership.TraceRoot(ctx, start, readOwner, maxHops)","language":"go"},{"title":"What stays in WLD","paragraphs":[],"bullets":["Event sources, queue, Pod filters and controller selection.","Metadata fetching and full labels/annotations used in its output.","Path reversal/merging, Workload writes and separate status updates.","Its existing partial-result policy for missing owners or depth limits, restricted to the verified prefix.","No NewDiscoverer, WorkloadForPod or optional attribution cache is added in this phase."]},{"title":"Which cache is used?","paragraphs":["readOwner uses WLD's existing metadata LRU, keyed by GVK/namespace/name and checked against UID. The production-path default is 1,024 entries with 30-second expiry. Benchmark settings are recorded separately."],"bullets":["Misses, expiry and UID mismatch trigger metadata reads through WLD's API reader.","Expiry is checked on lookup; it schedules no background refresh.","Root label events queue reconciliation. Existing roots get a separate direct metadata read without invalidating the owner LRU.","The 30-second TTL is not a guarantee that every tree node refreshes within 30 seconds."]},{"title":"Adoption status and differences","paragraphs":["The adapter is locally tested, not a deployed consumer migration. Strict UID, scope, cycle and controller-owner validation adds intentional error differences. WLD's filtered membership may exclude Pods included by complete SDK discovery."],"bullets":[]}],"source":[{"path":"examples/workloadinterface/INTEGRATION.md","line":111},{"path":"pkg/ownership/trace.go","line":101},{"path":"examples/workloadinterface/benchmarks/consumer-optimization/README.md","line":59}]},{"id":"ewi","title":"Replace the EWI component reader","lead":"The first External Workload Integrator adapter replaces component extraction inside the existing generic Karta parser.","why":"EWI can share definition interpretation while keeping its native handlers, resource accounting, persistent IDs and output model.","sections":[{"title":"Before","paragraphs":["JobSet is the generic-Karta example. Native handlers retain precedence for kinds they already support."],"bullets":[],"code":"JobSet Add/Update -> EWI informer cache -> task queue\n  -> current JobSet and matching definition\n  -> older component reader -> EWI converter\n  -> ExternalWorkload spec and observed status","language":"text"},{"title":"After phase 1","paragraphs":["Inside KartaTopOwnerHandler.Parse, the consumer converts its selected definition to SDK types, then creates the component reader. Its converter reads GetExtractedInstances(ctx) for selected Pod-bearing components and GetStatus(ctx) for the root."],"bullets":[],"code":"factory := resource.NewComponentFactoryFromObject(definition, object)\nrootComponent, err := factory.GetRootComponent()\nif err != nil { return err }\nchildComponents, err := factory.GetChildComponents()\nif err != nil { return err }\n// EWI's existing converter consumes these components.","language":"go"},{"title":"Cache and writes","paragraphs":[],"bullets":["Supported objects and selected definitions come from EWI's existing informer cache.","The SDK receives the already-read object and definition, not a Kubernetes client.","Component extraction makes no cluster reads; surrounding EWI logic can still read related objects.","Each parse makes a private typed definition copy. There is no retained conversion/result cache.","EWI keeps its requested-resource calculations, status precedence and ExternalWorkload writes.","This phase does not use NewDiscoverer, WorkloadForPod, DefinitionRegistry.Replace or Options.Cache."]},{"title":"Pod events are a separate path","paragraphs":[],"bullets":["Eligible Pod Add/Update reads the current cached Pod; Delete uses the event object.","Standalone Pods retain the native Pod parser.","An owned JobSet Pod follows EWI's existing owner lookup and missing top-owner label handling; it does not cause the generic root parser to run for every event.","Pod Add/Delete can enqueue StructureUpdater, which maintains persistent element IDs, status structure and Pod path labels.","Pod Update does not gain a regrouping guarantee for reparenting or label changes in this adapter."]},{"title":"Later: share classification","paragraphs":["This grouping replacement is proposed. The functions exist, but the EWI prototype does not yet use them. The consumer must supply its confirmed root and selected Pods."],"bullets":[],"code":"plan, err := attribution.Compile(definition)\nif err != nil { return err }\nprepared, err := attribution.Prepare(ctx, plan, rootObject)\nif err != nil { return err }\nfor _, pod := range selectedPods {\n    member, err := attribution.Evaluate(ctx, pod, prepared)\n    if err != nil { return err }\n    fmt.Printf(\"pod=%s component=%s path=%v issues=%v\\n\",\n        pod.Name, member.Component, member.Path, member.Issues)\n}","language":"go"},{"title":"Why grouping needs separate acceptance","paragraphs":[],"bullets":["EWI can keep multiple matching components; Evaluate chooses one most-specific producer and reports unrelated matches as ambiguous.","Owner-kind fallback, logical groups, persistent IDs and status writes remain consumer policies.","EWI's scheduler-filtered Pod cache cannot provide full-workload discovery coverage.","Replacing selective extraction with recursive Tree can evaluate previously ignored components and double-count globally extracted children.","The first adapter is locally tested and undeployed; full EWI migration is not claimed."]}],"source":[{"path":"examples/workloadinterface/INTEGRATION.md","line":215},{"path":"pkg/resource/component_factory.go","line":78},{"path":"examples/workloadinterface/INTEGRATION.md","line":347}]},{"id":"exporter","title":"Keep exporter work on the event path","lead":"Share ownership and attribution algorithms while keeping the exporter's metric store and scrape contract.","why":"A scrape should read prepared metric records. Moving discovery into every scrape would change the work and failure behavior clients depend on.","sections":[{"title":"Before and after","paragraphs":[],"bullets":[],"code":"Before:\nObject event -> local ownership / instance / attribution logic\n             -> compact metric records\nScrape       -> Store.Snapshot() -> metric families\n\nAfter phase 1:\nObject event -> shared ownership.Index / attribution functions\n             -> the same compact metric records\nScrape       -> Store.Snapshot() -> the same metric families","language":"text"},{"title":"The implemented adapter calls","paragraphs":["The owner adapter aliases ownership.Index. These statements are the exporter's actual InstanceIDs and Attribute adapters."],"bullets":[],"code":"return attribution.InstanceIDs(ctx, entry.Karta, workload, false)\n\n// In the separate Attribute adapter:\nreturn Result(attribution.AttributeLegacy(\n    ctx, pod, entry.Summary, entry.Definitions, instanceIDs,\n))","language":"go"},{"title":"Who watches what?","paragraphs":[],"bullets":["The exporter retains Pod and Karta informers.","Selected workload kinds use full-object informers; required owner kinds use metadata informers.","Callbacks process events directly; this SDK change adds no work queue.","Definition changes retain exporter-owned selection, watch reconciliation, workload rebuilding and forced Pod attribution."]},{"title":"Three retained data layers","paragraphs":[],"bullets":["Informer stores supply current Pods, workload objects and owner metadata.","ownership.Index maintains relationships through UpsertTrackedObject, Resolve and DeleteObject.","The existing metric store publishes compact records, including UpsertPod; Snapshot reads them on scrape.","Instance IDs are reused from stored workload state when available.","The higher-level discovery attribution cache is not enabled by these adapters."]},{"title":"When Pod metrics change","paragraphs":[],"bullets":["Relevant Pod updates reattribute that Pod; deletion removes its record.","Changed owner edges or newly available owners reprocess affected cached descendants.","Accepted workload updates rebuild workload state and instance IDs. Existing Pods are reevaluated for relevant owner/component/instance changes or a forced definition rebuild.","A root label or template edit alone does not universally trigger Pod re-attribution.","A scrape sees completed event publications; it does not wait for all informers or refresh stale inputs."]},{"title":"Compatibility boundary","paragraphs":["AttributeLegacy preserves first-match behavior, degraded fields and existing failure reasons. Strict discovery is a different behavior choice. Metric names, labels and Helm values remain unchanged by these adapters. Newer PoC differences are not all integrated."],"bullets":[]}],"source":[{"path":"examples/workloadinterface/INTEGRATION.md","line":381},{"path":"exporter/pkg/owner/index.go","line":1},{"path":"exporter/pkg/attribute/attributor.go","line":1},{"path":"exporter/pkg/collector/collector.go","line":1},{"path":"exporter/pkg/controller/events.go","line":1}]},{"id":"evidence","title":"Read the measured evidence and remaining limits","lead":"Examples explain the API. Output comparisons, recordings and live fixtures establish specific behavior. Benchmarks measure specific workloads.","why":"Adoption decisions need the exact tested scope and revisions, including remaining regressions and proposed features.","sections":[{"title":"Run the executable examples","paragraphs":["Run from the SDK checkout. These examples use deterministic fixtures and do not require a cluster."],"bullets":[],"code":"go test ./examples/workloadinterface -run '^Example' -v","language":"bash"},{"title":"Recorded correctness evidence","paragraphs":["These are recorded validation results, not claims of a new run by this documentation page. The validation source identifies the tested revisions."],"bullets":["60 supported recordings: 582 recorded-state checks and 582 current-catalog tree comparisons.","44 matching historical tree errors remain documented; eight recordings were excluded.","Seven live fixture workloads across six reader modes: 42 membership comparisons against an independent UID oracle.","Additional live checks cover lifecycle, mutation, grouping, provider replacement, cluster scope and ownership changes.","Local WLD controller race checks and EWI parser/output checks passed at their recorded revisions.","These tests do not establish a deployed consumer migration or 100,000-workload production capacity."]},{"title":"Optimized integration versus original consumer","paragraphs":["The 2026-10-16 comparison retained all 300 successful processes. Operation-time figures are medians of five independent processes per case."],"bullets":["WLD: operations remain 2.9-8.7% slower; mixed fixed-work CPU is 3.0% higher. This overhead remains unresolved.","EWI: small parses are 9.0-10.2% faster, with 10.0-11.0% lower fixed-work CPU; 128-instance parsing is 0.8% slower.","Exporter: isolated warm owner lookup is 29.1% faster with no allocation; Pod events, workload updates and scrapes are within 0.5%.","The 100,000-workload ownership index retained about 144.7 MiB. This is not total exporter or deployment memory.","Allocation traffic, retained heap and peak RSS are different measurements. The raw report records each separately."]},{"title":"Pinned benchmark provenance","paragraphs":[],"bullets":["Optimized WLD and exporter used SDK source matching 355d8c96e5ae.","Optimized EWI used component reader c6cad432ab56 plus consumer-side typed definition conversion.","Later dependency pin changes do not change which implementation those timings measured.","A faster isolated lookup does not imply the same improvement for a complete service."]},{"title":"What remains separate","paragraphs":[],"bullets":["Broad EWI grouping adoption and matching persistent grouping semantics.","High-level ignored-parent workload boundaries.","Consumer rollout and validation in the intended deployment.","Newer exporter PoC differences beyond the shared compatibility adapters.","Capacity testing for the complete process, telemetry and cluster at the intended scale."]}],"source":[{"path":"examples/workloadinterface/VALIDATION.md","line":168},{"path":"examples/workloadinterface/VALIDATION.md","line":546},{"path":"examples/workloadinterface/benchmarks/consumer-optimization/README.md","line":19},{"path":"examples/workloadinterface/INTEGRATION.md","line":635}]}],"reference":{"metadata":{"spdx":"Apache-2.0","copyright":"Copyright (c) 2026 NVIDIA Corporation","revision":"e62efb74a512e39414669dd4d5e2fcfa072ac065","module":"github.com/dsx-ai-factory/workload-map","base_url":"https://github.com/AviadHayumi/workload-map/blob/e62efb74a512e39414669dd4d5e2fcfa072ac065/","status":"Proposed SDK implemented in the referenced fork revision. Do not assume a tagged module release includes it.","code_status":"All 43 usage fragments type-check in local function wrappers against this revision with Go 1.26.3. Fragments require the stated surrounding variables and imports; they are not presented as standalone programs."},"import_aliases":{"karta":"github.com/dsx-ai-factory/workload-map/pkg/karta","discovery":"github.com/dsx-ai-factory/workload-map/pkg/discovery","clientgo":"github.com/dsx-ai-factory/workload-map/pkg/discovery/clientgo","tree":"github.com/dsx-ai-factory/workload-map/pkg/tree","attribution":"github.com/dsx-ai-factory/workload-map/pkg/attribution","ownership":"github.com/dsx-ai-factory/workload-map/pkg/ownership","resource":"github.com/dsx-ai-factory/workload-map/pkg/resource","v1alpha1":"github.com/dsx-ai-factory/workload-map/pkg/api/runai/v1alpha1","instructions":"github.com/dsx-ai-factory/workload-map/pkg/instructions","corev1":"k8s.io/api/core/v1","metav1":"k8s.io/apimachinery/pkg/apis/meta/v1","unstructured":"k8s.io/apimachinery/pkg/apis/meta/v1/unstructured","schema":"k8s.io/apimachinery/pkg/runtime/schema","types":"k8s.io/apimachinery/pkg/types","meta":"k8s.io/apimachinery/pkg/api/meta","dynamic":"k8s.io/client-go/dynamic","metadata":"k8s.io/client-go/metadata","rest":"k8s.io/client-go/rest","kubernetes":"k8s.io/client-go/kubernetes"},"groups":[{"id":"start","title":"Start with one Pod","why":"Create the SDK and find the complete workload d workload queries can read one local generation instead of listing and tracing the namespace each time.","behavior":["A new Index is not synchronized. Replace validates a complete dataset before publishing it.","The application owns initial synchronization and ordered subsequent publication.","Each capture retains one generation even while later updates proceed.","This index and optional attribution cache are separate layers. CacheOptions does not cap the full index."],"example":{"kind":"fragment","context":"Inside a function returning error. ctx is context.Context; dataset is discovery.Dataset.","code":"index := discovery.NewIndex()\ngeneration, err := index.Replace(ctx, dataset)\nif err != nil { return err }\nfmt.Println(\"published generation:\", generation)","verification":"Go type-checked in a function wrapper against the pinned SDK revision. The stated inputs and imports are required; this fragment is not a standalone program."},"source":{"path":"pkg/discovery/index.go","line":104,"url":"https://github.com/AviadHayumi/workload-map/blob/e62efb74a512e39414669dd4d5e2fcfa072ac065/pkg/discovery/index.go#L104"},"related":["index-collect","index-update","cache-options"]},{"id":"index-collect","group":"cache","title":"Collect a complete dataset before publishing","signature":"func Collect(ctx context.Context, reader Reader, namespace string, extraRoots ...ObjectRef) (Dataset, error)\n\ntype Dataset struct {\n    Namespace          string\n    Objects            []*unstructured.Unstructured\n    Pods               []*corev1.Pod\n    Mappings           map[schema.GroupVersionKind]*meta.RESTMapping\n    PodResourceVersion string\n}","what":"Reads the complete Pod list and the owner objects needed to reach their workloads.","why":"An index needs a complete initial view before it can serve full-workload answers.","behavior":["extraRoots includes known workloads with zero Pods. Collect does not list every resource kind to find all empty workloads.","A failed read returns n ost watch coverage, lost ordering or a tombstone without UID requires Invalidate followed by a complete Replace.","The producer must order initial collection and events so an older list cannot replace newer state."],"example":{"kind":"fragment","context":"Inside a function returning error. index is *discovery.Index; generation is its current uint64; currentObject is *unstructured.Unstructured; deletedRef is discovery.ObjectRef.","code":"next, err := index.Apply(ctx, generation, discovery.Changes{\n    Upserts: []*unstructured.Unstructured{currentObject},\n    Deletes: []discovery.ObjectRef{deletedRef},\n})\nif err != nil { return err }\ngeneration = next\nfmt.Println(generation)","verification":"Go type-checked in a function wrapper against the pinned SDK revision. The stated inputs and imports are required; this fragment is not a standalone program."},"source":{"path":"pkg/discovery/index.go","line":179,"url":"https://github.com/AviadHayumi/workload-map/blob/e62efb74a512e39414669dd4d5e2fcfa072ac065/pkg/discovery/index.go#L179"},"related":["index","observation","reader-capabilities"]},{"id":"cache-options","group":"cache","title":"Reuse successful attribution within explicit limits","signature":"type CacheOptions struct {\n    MaxWorkloads int\n    MaxPods      int\n}","what":"Enables bounded reuse of derived membership results on a non-nil *discovery.Index.","why":"Repeated observations of unchanged indexed workloads can avoid repeating supported attribution work.","behavior":["Disabled by default: Options.Cache is nil.","Both limits must be positive. MaxWorkloads limits entries; MaxPods limits total retained Pod membership records.","These are counts, not byte limits or limits on total process memory.","Generic workloads and supported structural/static selectors are eligible. Other expressions and failed attribution bypass reuse.","The cache starts no watches, does not manage Index updates and does not promise a hit.","Passing a direct or custom reader with this o function exampleIndex(){return `${breadcrumbs('Examples')}<h1>Learn by running the SDK</h1><p class="lead">Each example answers one practical question. See the Go function, change the inputs, then run it and inspect its output.</p><div class="callout"><h3>Actual Go execution</h3><p>The playground contains a compiled copy of this SDK revision and the three-Pod JobSet fixture. It runs locally in your browser. The controls change inputs to the compiled examples; this page is not an arbitrary Go compiler or a cluster connection.</p></div><div class="example-list">${examples.map(x=>`<a class="card" href="playground.html#${escape(x.id)}"><span class="eyebrow">Example</span><h3>${escape(x.title||x.name||x.id)}</h3><p>${inline(x.what||x.description||x.summary||'Run this SDK operation and inspect the result.')}</p><small>Open example →</small></a>`).join('')}</div>`}
function errors(){return `${breadcrumbs('API reference')}<h1>Errors and boundaries</h1><p class="lead">Handle failed acquisition separately from incomplete semantic attribution.</p>${(DATA.reference.errors||[]).map(x=>`<section>${heading(2,x.name||x.symbol||x.error||x.id||'Error')}<p>${inline(x.what||x.when||x.meaning||x.description||'')}</p><p>${inline(x.response||x.action||x.handling||'')}</p>${x.code?codebox(x.code):''}</section>`).join('')}${heading(2,'Strict ownership errors')}<p>${inline(DATA.reference.ownership_errors.description)}</p><ul>${DATA.reference.ownership_errors.names.map(name=>`<li><code>ownership.${escape(name)}</code></li>`).join('')}</ul>${heading(2,'Integration boundaries')}<ul>${(DATA.reference.boundaries||[]).map(x=>`<li>${inline(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>${sources([{path:'pkg/discovery/reader.go',line:112},{path:'pkg/ownership/trace.go',line:31}])}`}
function about(){return `${breadcrumbs('About')}<h1>About these docs</h1><p class="lead">A learning guide and API reference for the proposed Karta workload SDK.</p>${heading(2,'Source and scope')}<p>Every API page links to the implemented proposal at <code>${DATA.revision}</code>. The documentation separates captured Pod membership, declared workload structure and caller-owned integration work.</p><p>The three consumer adapters are described as their current selected replacements. They are not presented as completed deployed migrations.</p>${heading(2,'Examples and evidence')}<p>The browser examples execute the actual SDK compiled to WebAssembly. Read-only Go functions show the operations they run. Inputs are bounded fixture choices. The full support code is available in the playground.</p><p>Recorded benchmark and replay results keep their original measured revisions. Browser execution is a learning tool, not a performance benchmark.</p>${heading(2,'Documentation approach')}<p>Inspired by the overview, symbol index, signatures and examples in ${link('https://pkg.go.dev/sync','Go package documentation')}, and the code-and-output learning flow of the ${link('https://go.dev/play/','Go Playground')}.</p><p>This site is independent of the Go project. It does not send programs to the Go Playground service.</p>${heading(2,'Offline use and licenses')}<p>Both pages contain their own styles and scripts. The playground also includes its Go runtime and SDK binary. Source links require an internet connection when opened.</p><p>Documentation and example source use Apache-2.0. The playground includes third-party notices and the Go runtime license.</p>${sources([{path:'LICENSE',line:1},{path:'examples/workloadinterface/VALIDATION.md',line:1}])}`}
function sidebar(){
 const list=(label,items)=>`<div class="sidebar-group"><div class="sidebar-label">${escape(label)}</div>${items.map(([route,title])=>link('#'+route,escape(title))).join('')}</div>`;
 const basic=guides.filter(g=>!['operator','live-definitions','wld','ewi','exporter','evidence'].includes(g.id));
 const adoption=guides.filter(g=>!basic.includes(g));
 $('sidebar').innerHTML=list('Start here',[['overview','Overview'],['quickstart','Quick start'],['examples','Runnable examples']])+list('Work with workloads',basic.map(g=>['guide/'+g.id,g.title]))+list('Integration and evidence',adoption.map(g=>['guide/'+g.id,g.title]))+list('API reference',[['reference','All symbols'],['errors','Errors and boundaries'],...groups.map(g=>['group/'+g.id,g.title])])+`<div class="sidebar-foot">Proposal branch<br><code>${DATA.revision.slice(0,12)}</code><p>${link('#about','About these docs')}</p></div>`;
}
function route(){
 let parts=decodeURIComponent(location.hash.slice(1)||'overview').split('/');const kind=parts[0],id=parts[1];const anchor=['guide','api','group'].includes(kind)?parts[2]:parts[1];const key=['guide','api','group'].includes(kind)?`${kind}/${id}`:kind;
 if(activeRoute!==key||!$('article').innerHTML){activeRoute=key;let html;
 if(kind==='overview')html=overview();else if(kind==='quickstart')html=quickstart();else if(kind==='reference')html=reference();else if(kind==='group')html=reference(id);else if(kind==='examples')html=exampleIndex();else if(kind==='about')html=about();else if(kind==='errors')html=errors();else if(kind==='guide'){const g=guides.find(x=>x.id===id);html=g?renderGuide(g):null}else if(kind==='api'){const r=records.find(x=>x.id===id);html=r?renderAPI(r):null}
 $('article').innerHTML=(html||`<h1>Page not found</h1><p>${link('#overview','Return to the SDK overview →')}</p>`)+footer();document.title=$('article').querySelector('h1')?.textContent+' | Karta SDK';window.scrollTo(0,0);buildTOC();
 }
 $('sidebar').querySelectorAll('a').forEach(a=>a.getAttribute('href')==='#'+key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));document.documentElement.classList.remove('nav-open');$('menu-button').setAttribute('aria-expanded','false');
 if(anchor)requestAnimationFrame(()=>$('article').querySelector('[id="'+CSS.escape(anchor)+'"]')?.scrollIntoView());
}
function buildTOC(){tocObserver?.disconnect();const headings=[...$('article').querySelectorAll('h2[id]')];$('toc').innerHTML=`<h2>On this page</h2>${headings.map(h=>link('#'+activeRoute+'/'+h.id,escape(h.textContent.replace(/#$/,'')))).join('')}`;tocObserver=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){$('toc').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash.endsWith('/'+entry.target.id))) }},{rootMargin:'-90px 0px -65% 0px'});headings.forEach(h=>tocObserver.observe(h))}
const searchable=[{route:'overview',title:'Overview',description:'One Pod to whole workload. Start with the main SDK query.'},{route:'quickstart',title:'Quick start',description:'Install the proposal checkout, run examples and read a cluster.'},{route:'examples',title:'Runnable examples',description:'Run real Go SDK functions on a JobSet fixture.'},...guides.map(g=>({route:'guide/'+g.id,title:g.title,description:g.lead+' '+g.why})),...records.map(r=>({route:'api/'+r.id,title:symbol(r)+' · '+r.title,description:r.what+' '+r.why+' '+r.signature}))];
function search(){const q=$('search-input').value.toLowerCase().trim();const words=q.split(/\s+/);const matches=searchable.map(x=>({...x,score:words.reduce((n,w)=>n+(x.title.toLowerCase().includes(w)?8:0)+(x.description.toLowerCase().includes(w)?1:0),0)})).filter(x=>!q||words.every(w=>(x.title+' '+x.description).toLowerCase().includes(w))).sort((a,b)=>b.score-a.score).slice(0,12);$('search-results').innerHTML=matches.length?matches.map(x=>link('#'+x.route,`<b>${escape(x.title)}</b><small>${escape(x.description.slice(0,140))}</small>`)).join(''):'<p class="empty">No matching API or guide. Try “Pods”, “cache” or “definition”.</p>'}
function openSearch(){$('search-dialog').showModal();$('search-input').value='';search();$('search-input').focus()}
$('search-open').addEventListener('click',openSearch);$('search-close').addEventListener('click',()=>$('search-dialog').close());$('search-input').addEventListener('input',search);$('search-results').addEventListener('click',e=>{if(e.target.closest('a'))$('search-dialog').close()});$('search-input').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('search-results').querySelector('a')?.focus()}if(e.key==='Enter'){e.preventDefault();const a=$('search-results').querySelector('a');if(a){location.hash=a.hash;$('search-dialog').close()}}});document.addEventListener('keydown',e=>{const editing=e.target.closest('input,textarea,select,[contenteditable]');if((e.key==='/'&&!editing)||((e.ctrlKey||e.metaKey)&&e.key==='k')){e.preventDefault();openSearch()}if(e.key==='Escape'){document.documentElement.classList.remove('nav-open');$('menu-button').setAttribute('aria-expanded','false')}});
$('menu-button').addEventListener('click',()=>{const open=document.documentElement.classList.toggle('nav-open');$('menu-button').setAttribute('aria-expanded',String(open))});$('overlay').addEventListener('click',()=>{document.documentElement.classList.remove('nav-open');$('menu-button').setAttribute('aria-expanded','false')});
async function copy(text){if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);return}catch{}}const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.left='-9999px';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('Copy unavailable')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const code=b.closest('.codebox')?.querySelector('pre code');if(!code)return;try{await copy(code.textContent);b.textContent='Copied'}catch{b.textContent='Select code'}setTimeout(()=>b.textContent='Copy',1800)});
try{document.documentElement.dataset.theme=localStorage.getItem('karta-docs-theme')||'light'}catch{}
$('theme-toggle').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('karta-docs-theme',t)}catch{}});
sidebar();window.addEventListener('hashchange',route);activeRoute='';route();
window.sdkDocs={guides:guides.length,records:records.length,routes:searchable.map(x=>x.route)};
})();
</script></body></html>
