kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: batch-cronjob-v1
spec:
  variables:
    - name: specJobTemplateSpecParallelism
      expression: ([dyn(object[?"spec"][?"jobTemplate"][?"spec"][?"parallelism"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
  structureDefinition:
    rootComponent:
      name: cronjob
      kind:
        group: batch
        version: v1
        kind: CronJob
      specDefinition:
        podTemplateSpec:
          read:
            expression: object[?"spec"][?"jobTemplate"][?"spec"][?"template"].orValue(dyn(null))
          write:
            path: /spec/jobTemplate/spec/template
      scaleDefinition:
        replicas:
          read:
            expression: variables.specJobTemplateSpecParallelism
          write:
            path: /spec/jobTemplate/spec/parallelism
      statusDefinition:
        statusMappings:
          initializing:
            - byExpression:
                expression: object[?"spec"][?"suspend"].orValue(false) != true && (object[?"status"][?"lastScheduleTime"].orValue(dyn(null)) == null)
          running:
            - byExpression:
                expression: object[?"spec"][?"suspend"].orValue(false) != true && (object[?"status"][?"lastScheduleTime"].orValue(dyn(null)) != null)
          suspended:
            - byExpression:
                expression: object[?"spec"][?"suspend"].orValue(false) == true
      suspendDefinition:
        suspendActions:
          - write:
              path: /spec/suspend
            value: "true"
        resumeActions:
          - write:
              path: /spec/suspend
            value: "false"
    childComponents:
      - name: job
        kind:
          group: batch
          version: v1
          kind: Job
        ownerRef: cronjob
  optimizationInstructions: {}
