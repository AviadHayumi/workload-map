apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  tutorial.yaml: |
    groups:
      - name: tutorial
        interval: 5s
        rules:
        - record: tutorial:job_running:eligible
          expr: |
            (min_over_time(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"}[2m]) == 1)
            and (count_over_time(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"}[2m]) >= 23)
            and (dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"} == 1)
            and (dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"} offset 2m == 1)
            and (time() - 120 - timestamp(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"} offset 2m) < 15)
            and (time() - timestamp(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Running",observation_valid="true"}) < 15)
            and on (namespace, workload_uid)
              (time() - dsx_workload_created_timestamp_seconds{namespace="ai-lab"} > 120)
            unless on (namespace, workload_uid)
              count_over_time(dsx_workload_status{namespace="ai-lab",observation_valid="false"}[2m])
            unless on (namespace, workload_uid)
              count_over_time(dsx_exporter_observation_valid{namespace="ai-lab",scope="workload"}[2m])
            and on () (min_over_time(up{job="dsx-exporter"}[2m]) == 1)
            and on () (count_over_time(up{job="dsx-exporter"}[2m]) >= 23)
            and on () (up{job="dsx-exporter"} == 1)
            and on () (time() - timestamp(up{job="dsx-exporter"}) < 15)
        - record: tutorial:job_completed:eligible
          expr: |
            (min_over_time(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"}[2m]) == 1)
            and (count_over_time(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"}[2m]) >= 23)
            and (dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"} == 1)
            and (dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"} offset 2m == 1)
            and (time() - 120 - timestamp(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"} offset 2m) < 15)
            and (time() - timestamp(dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",phase="Completed",observation_valid="true"}) < 15)
            and on (namespace, workload_uid)
              (time() - dsx_workload_created_timestamp_seconds{namespace="ai-lab"} > 120)
            unless on (namespace, workload_uid)
              count_over_time(dsx_workload_status{namespace="ai-lab",observation_valid="false"}[2m])
            unless on (namespace, workload_uid)
              count_over_time(dsx_exporter_observation_valid{namespace="ai-lab",scope="workload"}[2m])
            and on () (min_over_time(up{job="dsx-exporter"}[2m]) == 1)
            and on () (count_over_time(up{job="dsx-exporter"}[2m]) >= 23)
            and on () (up{job="dsx-exporter"} == 1)
            and on () (time() - timestamp(up{job="dsx-exporter"}) < 15)
