name: Renovate operator validation
on:
  workflow_dispatch:
    inputs:
      operator:
        description: Operator group to validate
        type: string
        default: jobset
permissions:
  contents: write
  pull-requests: write
  issues: read
  statuses: write
jobs:
  validate:
    uses: ./.github/workflows/renovate-operators.yaml
    with:
      operator: ${{ inputs.operator }}
      base-branch: ${{ github.ref_name }}
