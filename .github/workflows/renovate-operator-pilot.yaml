name: Renovate operator pilot

on:
  push:
    branches: [codex/e2e-renovate-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-operator-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-record-publish:
    name: Renovate update, live recording, and PR
    if: github.repository == 'AviadHayumi/workload-map' && github.ref == 'refs/heads/codex/e2e-renovate-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    env:
      PILOT_BASE_BRANCH: ${{ github.ref_name }}
      PILOT_BASE_SHA: ${{ github.sha }}
      PILOT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      PILOT_TRACKING_ISSUE: ${{ vars.E2E_OPERATOR_TRACKING_ISSUE }}
      PILOT_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum
            test/e2e/go.sum

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Verify the public tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          match = re.fullmatch(r'https://github.com/dsx-ai-factory/workload-map/issues/([1-9][0-9]*)', os.environ['PILOT_TRACKING_ISSUE'])
          assert match, 'Set E2E_OPERATOR_TRACKING_ISSUE to the public tracking issue URL'
          issue = json.loads(subprocess.check_output(['gh', 'api', 'repos/dsx-ai-factory/workload-map/issues/' + match.group(1)], text=True))
          assert issue['state'] == 'open', 'The tracking issue must be open'
          PYCODE

      - name: Read pinned cluster tools
        run: |
          . ./hack/e2e/global.env
          {
            echo "KIND_VERSION=$KIND_VERSION"
            echo "KUBECTL_VERSION=$KUBECTL_VERSION"
            echo "HELM_VERSION=$HELM_VERSION"
          } >> "$GITHUB_ENV"
          mkdir -p "$PILOT_ARTIFACT_DIR"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}

      - name: Renovate records, validates, and commits the update
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/hack/e2e/renovate-pilot/config.cjs
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate-operator-pilot
          LOG_LEVEL: debug
        run: |
          npm exec --yes --package=renovate@44.151.0 -- renovate

      - name: Verify the bot commit contains the exact CI recordings
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "$PILOT_ARTIFACT_DIR/commit-files.sha256"
          branch="codex/renovate-pilot/${PILOT_RUN}/jobset"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
          test "${#sha}" = 40
          git fetch origin "$sha"
          git checkout --detach "$sha"
          python3 hack/e2e/renovate-pilot/verify_commit.py --manifest "$PILOT_ARTIFACT_DIR/commit-files.sha256" --base-sha "$PILOT_BASE_SHA"
          jq --arg candidate "$sha" --arg branch "$branch" '. + {candidate: $candidate, branch: $branch}' "$PILOT_ARTIFACT_DIR/provenance.json" > "$PILOT_ARTIFACT_DIR/provenance-final.json"
          {
            echo "branch=$branch"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the CI check and prepare the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_BRANCH: ${{ steps.candidate.outputs.branch }}
          PILOT_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${PILOT_CANDIDATE_SHA}" \
            -f state=success -f context='e2e/JobSet recording and replay' \
            -f target_url="$run_url" \
            -f description='CI: kind install, 5 live recordings, replay, and make check passed'
          python3 - <<'PY'
          import os
          from pathlib import Path
          run = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          body = '''## What does this PR do?

          Renovate updated JobSet from v0.10.1 to v0.12.0 and committed the five generated recordings in the same bot commit. GitHub Actions created a fresh kind cluster, installed the updated operator, recorded running/completed/failed/resumed/suspended flows, replayed the fixtures, and ran make check before Renovate pushed the commit.

          Recording and committing happened entirely in CI. The published commit was checked against the exact file hashes produced by the recording job. The temporary cluster was deleted. This validates JobSet on Kubernetes v1.34.0; other operators need their own compatibility checks.

          [Open the recording and validation run](RUN_URL). The artifacts include recording.log, make-check.log, JUnit, controller image digest, Kubernetes version, file hashes, and source provenance.

          This PR targets the dedicated pilot branch in the personal fork. It contains only the version pin and CI-generated recordings. The pipeline implementation is on the base branch.

          ## Related issue(s)

          Related to TRACKING_ISSUE.

          ## Checklist

          - [x] All commits are signed off with DCO
          - [x] Generated recordings have SPDX license and copyright headers
          - [x] Documentation: CI evidence is linked above
          - [x] Tests pass: five live flows, replay, and make check
          - [x] No proprietary or internal information included
          '''.replace('RUN_URL', run).replace('TRACKING_ISSUE', os.environ['PILOT_TRACKING_ISSUE'])
          Path(os.environ['PILOT_ARTIFACT_DIR'], 'pr-body.md').write_text(body)
          PY

      - name: Open the bot PR
        if: vars.E2E_OPERATOR_CREATE_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$PILOT_BASE_BRANCH" \
            --head "$PILOT_BRANCH" --draft \
            --title 'build(e2e): update JobSet to v0.12.0 with CI recordings' \
            --body-file "$PILOT_ARTIFACT_DIR/pr-body.md")
          printf '%s\n' "$pr_url" | tee "$PILOT_ARTIFACT_DIR/pr-url.txt"
          printf 'Renovate committed the pin and five CI recordings together.\n\nPR: %s\n\nRun: %s\n' "$pr_url" "$run_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence and recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renovate-jobset-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Ensure the temporary cluster is removed
        if: always()
        run: kind delete cluster --name "renovate-jobset-${PILOT_RUN}"
