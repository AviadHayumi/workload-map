kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: ray-io-rayservice-v1
spec:
  variables:
    - name: workerGroups
      expression: ([dyn(object[?"spec"][?"rayClusterConfig"][?"workerGroupSpecs"].orValue(dyn(null)))].filter(v, type(v) == list) + [[]])[0]
    - name: workerReplicas
      expression: variables.workerGroups.map(x, dyn(x[?"replicas"].orValue(dyn(null)))).filter(v, v != null && v != false)
  structureDefinition:
    rootComponent:
      name: rayservice
      kind:
        group: ray.io
        version: v1
        kind: RayService
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: Initializing
          running:
            - byConditions:
                - type: Ready
                  status: "True"
          failed:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: InitializingTimeout
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: ValidationFailed
          degraded:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: ZeroServeEndpoints
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpec:
            read:
              expression: object[?"spec"][?"rayClusterConfig"][?"headGroupSpec"][?"template"].orValue(dyn(null))
            write:
              path: /spec/rayClusterConfig/headGroupSpec/template
        scaleDefinition:
          replicas:
            read:
              expression: "1"
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"ray.io/node-type"].orValue(dyn(null))
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpec:
            read:
              expression: ([dyn(object[?"spec"][?"rayClusterConfig"][?"workerGroupSpecs"].orValue(dyn(null)))].filter(v, type(v) == list) + [[]])[0].map(x, x[?"template"].orValue(dyn(null)))
            write:
              pathExpression: '"/spec/rayClusterConfig/workerGroupSpecs/" + string(index) + "/template"'
        scaleDefinition:
          replicas:
            read:
              expression: '(variables.workerReplicas.size() > 0 ? variables.workerReplicas : [dyn(1)])'
            write:
              pathExpression: '"/spec/rayClusterConfig/workerGroupSpecs/" + string(index) + "/replicas"'
        instanceIds:
          read:
            expression: ([dyn(object[?"spec"][?"rayClusterConfig"][?"workerGroupSpecs"].orValue(dyn(null)))].filter(v, type(v) == list) + [[]])[0].map(x, x[?"groupName"].orValue(dyn(null)))
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"ray.io/node-type"].orValue(dyn(null))
            value: worker
          componentInstanceSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"ray.io/group"].orValue(dyn(null))
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: head
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"ray.io/cluster"].orValue(dyn(null))
            - componentName: worker
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"ray.io/cluster"].orValue(dyn(null))
