{
  "apiVersion": "kubeflow.org/v1",
  "kind": "PyTorchJob",
  "metadata": {
    "name": "matrix-pytorch"
  },
  "spec": {
    "pytorchReplicaSpecs": {
      "Master": {
        "replicas": 1,
        "restartPolicy": "Never",
        "template": {
          "spec": {
            "containers": [
              {
                "name": "pytorch",
                "image": "busybox:1.36",
                "command": [
                  "sleep",
                  "600"
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  }
                }
              }
            ]
          }
        }
      },
      "Worker": {
        "replicas": 2,
        "restartPolicy": "Never",
        "template": {
          "spec": {
            "containers": [
              {
                "name": "pytorch",
                "image": "busybox:1.36",
                "command": [
                  "sleep",
                  "600"
                ],
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  }
                }
              }
            ]
          }
        }
      }
    }
  }
}
