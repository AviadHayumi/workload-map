kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: kubeflow-org-mpijob-v2beta1
spec:
  variables:
    - name: specMpiReplicaSpecsLauncherReplicas
      expression: ([dyn(object[?"spec"][?"mpiReplicaSpecs"][?"Launcher"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
    - name: specMpiReplicaSpecsWorkerReplicas
      expression: ([dyn(object[?"spec"][?"mpiReplicaSpecs"][?"Worker"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
  structureDefinition:
    rootComponent:
      name: mpijob
      kind:
        group: kubeflow.org
        version: v2beta1
        kind: MPIJob
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byConditions:
                - type: Created
                  status: "True"
          running:
            - byConditions:
                - type: Running
                  status: "True"
          completed:
            - byConditions:
                - type: Succeeded
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      suspendDefinition:
        suspendActions:
          - write:
              path: /spec/runPolicy/suspend
            value: "true"
        resumeActions:
          - write:
              path: /spec/runPolicy/suspend
            value: "false"
    childComponents:
      - name: launcher
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpec:
            read:
              expression: object[?"spec"][?"mpiReplicaSpecs"][?"Launcher"][?"template"].orValue(dyn(null))
            write:
              path: /spec/mpiReplicaSpecs/Launcher/template
        scaleDefinition:
          replicas:
            read:
              expression: variables.specMpiReplicaSpecsLauncherReplicas
            write:
              path: /spec/mpiReplicaSpecs/Launcher/replicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"training.kubeflow.org/job-role"].orValue(dyn(null))
            value: launcher
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpec:
            read:
              expression: object[?"spec"][?"mpiReplicaSpecs"][?"Worker"][?"template"].orValue(dyn(null))
            write:
              path: /spec/mpiReplicaSpecs/Worker/template
        scaleDefinition:
          replicas:
            read:
              expression: variables.specMpiReplicaSpecsWorkerReplicas
            write:
              path: /spec/mpiReplicaSpecs/Worker/replicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"training.kubeflow.org/job-role"].orValue(dyn(null))
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: launcher
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"training.kubeflow.org/job-name"].orValue(dyn(null))
            - componentName: worker
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"training.kubeflow.org/job-name"].orValue(dyn(null))
