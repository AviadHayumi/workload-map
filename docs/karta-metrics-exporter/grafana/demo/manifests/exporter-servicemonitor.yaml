apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: karta-metrics-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: karta-metrics-exporter
      app.kubernetes.io/instance: karta-metrics-exporter
  namespaceSelector:
    matchNames:
    - monitoring
  endpoints:
  - port: metrics
    interval: 15s
    honorLabels: true
    relabelings:
    - targetLabel: job
      replacement: karta-exporter
