rule_files:
- kep-rules.yaml
evaluation_interval: 30s
tests:
- name: cpu-and-memory-units
  interval: 30s
  input_series:
  - series: karta_pod_workload_info{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",pod_name="decode-0",pod_uid="p-d",replica_group_id="",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",submitted_by="alpha"}
    values: 1x20
  - series: karta_workload_status{karta="dynamo-definition",karta_source="catalog",namespace="team-a",owner_resolution="resolved",phase="Running",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",observation_valid="true",submitted_by="alpha"}
    values: 1x20
  - series: DCGM_FI_DEV_GPU_UTIL{UUID="gpu-a",namespace="team-a",pod="decode-0",pod_uid="p-d"}
    values: 1x20
  - series: container_cpu_usage_seconds_total{container="worker",namespace="team-a",pod="decode-0"}
    values: 100+6x20
  - series: container_memory_working_set_bytes{container="worker",namespace="team-a",pod="decode-0"}
    values: 536870912x20
  promql_expr_test:
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload_name, workload_uid,
              owner_resolution, component, component_instance, replica_group_id, submitted_by) (
        label_replace(
          rate(container_cpu_usage_seconds_total{
            namespace!="", pod!="", container!="", container!="POD"
          }[5m]),
          "pod_name", "$1", "pod", "(.+)"
        )
        * on (namespace, pod_name)
          group_left (workload_group, workload_version, workload_kind, workload_name, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id, submitted_by)
          karta:pod_attribution:unique{observation_valid="true",component!="<unknown>",component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",submitted_by="alpha"}'
      value: 0.2
  - expr: |-
      sum by (namespace, workload_group, workload_version, workload_kind, workload_name, workload_uid,
              owner_resolution, component, component_instance, replica_group_id, submitted_by) (
        label_replace(
          container_memory_working_set_bytes{namespace!="",pod!="",container!="",container!="POD"},
          "pod_name", "$1", "pod", "(.+)"
        )
        * on (namespace, pod_name)
          group_left (workload_group, workload_version, workload_kind, workload_name, workload_uid,
                      owner_resolution, component, component_instance, replica_group_id, submitted_by)
          karta:pod_attribution:unique{observation_valid="true",component!="<unknown>",component_instance!="<unknown>"}
      )
    eval_time: 5m
    exp_samples:
    - labels: '{component="service",component_instance="decode",namespace="team-a",owner_resolution="resolved",workload_name="dynamo",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",workload_uid="w-d",workload_version="v1alpha1",submitted_by="alpha"}'
      value: 536870912
