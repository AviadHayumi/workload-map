{{- if and .Values.exporter.enabled (eq (include "karta.exporter.attributionEnabled" .) "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}-identity
  namespace: {{ .Release.Namespace }}
data:
  rules.json: {{ include "karta.exporter.identityConfig" . | quote }}
{{- end }}
