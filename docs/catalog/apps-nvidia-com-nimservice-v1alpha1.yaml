kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: apps-nvidia-com-nimservice-v1alpha1
spec:
  variables:
    - name: specReplicas
      expression: ([dyn(object[?"spec"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
    - name: statusState
      expression: ([dyn(object.?status.?state.orValue(dyn(null)))].filter(v, v != null && v != false) + [""])[0]
  structureDefinition:
    rootComponent:
      name: nimservice
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMService
      specDefinition:
        fragmentedPodSpecDefinition:
          schedulerName:
            read:
              expression: object[?"spec"][?"schedulerName"].orValue(dyn(null))
            write:
              path: /spec/schedulerName
          labels:
            read:
              expression: object[?"spec"][?"labels"].orValue(dyn(null))
            write:
              path: /spec/labels
          annotations:
            read:
              expression: object[?"spec"][?"annotations"].orValue(dyn(null))
            write:
              path: /spec/annotations
          resources:
            read:
              expression: object[?"spec"][?"resources"].orValue(dyn(null))
            write:
              path: /spec/resources
          podAffinity:
            read:
              expression: object[?"spec"][?"affinity"][?"podAffinity"].orValue(dyn(null))
            write:
              path: /spec/affinity/podAffinity
          nodeAffinity:
            read:
              expression: object[?"spec"][?"affinity"][?"nodeAffinity"].orValue(dyn(null))
            write:
              path: /spec/affinity/nodeAffinity
      scaleDefinition:
        replicas:
          read:
            expression: variables.specReplicas
          write:
            path: /spec/replicas
      statusDefinition:
        phaseDefinition:
          read:
            expression: object[?"status"][?"state"].orValue(dyn(null))
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          initializing:
            - byPhase: NotReady
            - byPhase: Pending
          running:
            - byPhase: Ready
          failed:
            - byPhase: Failed
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: nimservice
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(dyn(null))
