apiVersion: v1
kind: Service
metadata:
  name: karta-metadata-probe
  namespace: "karta-metadata-probe"
  labels:
    app.kubernetes.io/instance: mini-service
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nginx
    app.kubernetes.io/version: 1.27.2
