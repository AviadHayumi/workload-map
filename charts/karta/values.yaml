# Default values for the karta operator chart.
# Override with --set key=value or -f my-values.yaml.

global:
  # Go FIPS 140-3 runtime mode: off, on, or only. See docs/FIPS.md.
  fipsMode: "off"

# Set false to skip the operator workload.
operator:
  enabled: true

# Read-only workload metrics. Can run with operator.enabled=false.
exporter:
  enabled: false
  image:
    repository: ghcr.io/dsx-ai-factory/workload-map/karta-metrics-exporter
    # When empty, falls back to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  http:
    port: 8080
  namespaceSelector: {}
  objectSelector: {}
  podSelector: {}
  resourceRules: []
  excludeResourceRules: []
  ignoredOwnerKinds: []
  requiredKinds: []
  # Default concurrency for each leaf and root queue.
  workers: 2
  # Zero inherits workers. Positive values configure each queue independently.
  leafWorkers: 0
  rootWorkers: 0
  kartaDefinitionSource:
    catalog:
      enabled: false
      include: []
      exclude: [core-pod-v1]
    cluster:
      enabled: true
      include: []
      exclude: []
      labelSelector: {}
  serviceAccount:
    create: true
    name: ""
  rbac:
    # Workload and child kinds the exporter may read, rendered into the base
    # ClusterRole (no wildcards). Defaults cover common built-in catalog
    # kinds. For anything else, either extend this list or create a
    # ClusterRole labeled karta.run.ai/exporter-rbac: "true"; the bound role
    # aggregates it automatically.
    workloadRules:
      - apiGroups: [""]
        resources: ["replicationcontrollers"]
      - apiGroups: ["batch"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
      - apiGroups: ["jobset.x-k8s.io"]
        resources: ["jobsets"]
      - apiGroups: ["kubeflow.org"]
        resources: ["pytorchjobs", "mpijobs"]
      - apiGroups: ["ray.io"]
        resources: ["rayclusters", "rayjobs", "rayservices"]
      - apiGroups: ["leaderworkerset.x-k8s.io"]
        resources: ["leaderworkersets"]
      - apiGroups: ["serving.knative.dev"]
        resources: ["services", "configurations", "revisions"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["inferenceservices"]
      - apiGroups: ["milvus.io"]
        resources: ["milvuses"]
      - apiGroups: ["apps.nvidia.com"]
        resources: ["nimservices", "nimcaches"]
      - apiGroups: ["nvidia.com"]
        resources: ["dynamographdeployments", "dynamocomponentdeployments"]
      - apiGroups: ["grove.io", "scheduler.grove.io"]
        resources: ["podcliquesets", "podcliques", "podcliquescalinggroups", "podgangs"]

  serviceMonitor:
    # Requires Prometheus Operator ServiceMonitor CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 25s
    labels: {}
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra labels for Pod info and workload status. Expressions read object.
  # See karta-metrics-exporter/pkg/labelevaluator/README.md.
  labelRules: []
  # Shared CEL bounds. Zero selects the default, except interruptCheckFrequency.
  labelLimits:
    costLimit: 10000
    maxExpressionBytes: 4096
    maxValueBytes: 1024
    interruptCheckFrequency: 100

# Overrides for resource names. Rarely needed.
fullnameOverride: ""

# Keep at 1 unless leaderElection.enabled is true; without leader election
# multiple replicas would reconcile concurrently.
replicaCount: 1

# When enabled, only the replica holding the lease reconciles (active/passive).
# The chart also creates a namespaced Role/RoleBinding for the lease object.
leaderElection:
  enabled: false
  id: karta-operator.run.ai

image:
  repository: ghcr.io/dsx-ai-factory/workload-map/karta-operator
  # When empty, falls back to .Chart.AppVersion so chart and image versions
  # stay in lockstep.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registries.
imagePullSecrets: []

# Pod annotations (e.g. Prometheus scrape hints).
podAnnotations: {}

serviceAccount:
  # Set false to use an externally managed ServiceAccount (set name below).
  create: true
  # Only used when create: false — name of the externally managed SA.
  name: ""

ports:
  metrics: 8080
  health: 8081

webhook:
  enabled: true
  port: 9443
  cert:
    # auto: the operator self-signs and rotates the serving cert (no cert-manager).
    # manual: certs are supplied externally (cert-manager, an admin, ...); the
    #   operator only reads the mounted Secret and never touches the cert.
    provisionMode: auto
    # manual mode only: a static CA bundle to stamp on the webhook configs.
    caBundle: ""
    # manual mode only: annotations for the webhook configs. Wire cert-manager
    # here, e.g. cert-manager.io/inject-ca-from: <namespace>/<certificate-name>
    annotations: {}

logLevel: info

# Extra flags appended after the chart's default args. Use this to add flags
# without replacing the defaults entirely.
extraArgs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# A pre-install/pre-upgrade Job server-side-applies the bundled CRD, so
# `helm upgrade` rolls the schema forward (Helm never upgrades crds/ itself).
crdUpgrader:
  enabled: true
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.34.0
    pullPolicy: IfNotPresent
  backoffLimit: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 2Gi
