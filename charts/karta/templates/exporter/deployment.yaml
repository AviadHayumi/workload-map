{{- if .Values.exporter.enabled -}}
{{- if ne .Values.exporter.metricsExporter "prometheus" -}}
{{- fail "exporter.metricsExporter must be prometheus; native OTLP delivery is deferred" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.exporter.replicaCount }}
  selector:
    matchLabels:
      {{- include "karta.exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karta.exporter.selectorLabels" . | nindent 8 }}
      {{- with .Values.exporter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "karta.exporter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.exporter.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.exporter.ports.metrics }}
            - --metrics-exporter={{ .Values.exporter.metricsExporter }}
            {{- with .Values.exporter.namespace }}
            - {{ printf "--namespace=%s" . | quote }}
            {{- end }}
            {{- with .Values.exporter.ignoredOwnerKinds }}
            - {{ printf "--ignored-owner-kinds=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.exporter.requiredKinds }}
            - {{ printf "--required-kinds=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.exporter.useCatalog }}
            - --use-catalog
            {{- end }}
            - --workload-phases={{ .Values.exporter.metrics.workloadPhases | join "," }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.ports.metrics }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.exporter.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
      {{- with .Values.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
