{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "matrix-job"
  },
  "spec": {
    "backoffLimit": 0,
    "template": {
      "metadata": {
        "labels": {
          "app": "matrix-job"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "worker",
            "image": "busybox:1.36",
            "command": [
              "true"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              }
            }
          }
        ],
        "terminationGracePeriodSeconds": 0,
        "restartPolicy": "Never"
      }
    }
  }
}
