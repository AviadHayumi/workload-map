kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: milvus-io-milvus-v1beta1
spec:
  variables:
    - name: statusStatus
      expression: ([dyn(object.?status.?status.orValue(dyn(null)))].filter(v, v != null && v != false) + [""])[0]
  structureDefinition:
    references:
      - name: etcdStatefulSets
        apiVersion: apps/v1
        kind: StatefulSet
        matchExpression: '!object.?spec.?dependencies.?etcd.?external.orValue(false)'
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: etcdCronJobs
        apiVersion: batch/v1
        kind: CronJob
        matchExpression: '!object.?spec.?dependencies.?etcd.?external.orValue(false)'
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: minioDeployments
        apiVersion: apps/v1
        kind: Deployment
        matchExpression: '!object.?spec.?dependencies.?storage.?external.orValue(false)'
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: minioStatefulSets
        apiVersion: apps/v1
        kind: StatefulSet
        matchExpression: '!object.?spec.?dependencies.?storage.?external.orValue(false)'
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: pulsarStatefulSets
        apiVersion: apps/v1
        kind: StatefulSet
        matchExpression: object.?spec.?dependencies.?msgStreamType.orValue("") == "pulsar" && !object.?spec.?dependencies.?pulsar.?external.orValue(false)
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: pulsarDeployments
        apiVersion: apps/v1
        kind: Deployment
        matchExpression: object.?spec.?dependencies.?msgStreamType.orValue("") == "pulsar" && !object.?spec.?dependencies.?pulsar.?external.orValue(false)
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: pulsarJobs
        apiVersion: batch/v1
        kind: Job
        matchExpression: object.?spec.?dependencies.?msgStreamType.orValue("") == "pulsar" && !object.?spec.?dependencies.?pulsar.?external.orValue(false)
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: pulsarDaemonSets
        apiVersion: apps/v1
        kind: DaemonSet
        matchExpression: object.?spec.?dependencies.?msgStreamType.orValue("") == "pulsar" && !object.?spec.?dependencies.?pulsar.?external.orValue(false)
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
              value: Helm
      - name: kafkaStatefulSets
        apiVersion: apps/v1
        kind: StatefulSet
        matchExpression: object.?spec.?dependencies.?msgStreamType.orValue("") == "kafka" && !object.?spec.?dependencies.?kafka.?external.orValue(false)
        list:
          matchLabels:
            app.kubernetes.io/managed-by:
