{
  "apiVersion": "nvidia.com/v1alpha1",
  "kind": "DynamoGraphDeployment",
  "metadata": {
    "name": "matrix-dynamo"
  },
  "spec": {
    "services": {
      "Frontend": {
        "componentType": "frontend",
        "extraPodSpec": {
          "mainContainer": {
            "env": [
              {
                "name": "TOKIO_WORKER_THREADS",
                "value": "2"
              },
              {
                "name": "OMP_NUM_THREADS",
                "value": "1"
              }
            ],
            "image": "nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.2.1",
            "imagePullPolicy": "IfNotPresent",
            "name": "",
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            }
          }
        },
        "replicas": 1
      },
      "decode": {
        "componentType": "worker",
        "extraPodSpec": {
          "mainContainer": {
            "args": [
              "--model-path",
              "nvidia/Llama-3.1-8B-Instruct-FP8",
              "--model-name",
              "nvidia/Llama-3.1-8B-Instruct-FP8",
              "--speedup-ratio",
              "1.0",
              "--planner-profile-data",
              "/workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D",
              "--disaggregation-mode",
              "decode"
            ],
            "command": [
              "python3",
              "-m",
              "dynamo.mocker"
            ],
            "env": [
              {
                "name": "TOKIO_WORKER_THREADS",
                "value": "2"
              },
              {
                "name": "OMP_NUM_THREADS",
                "value": "1"
              }
            ],
            "image": "nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.2.1",
            "imagePullPolicy": "IfNotPresent",
            "name": "",
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            },
            "workingDir": "/workspace"
          }
        },
        "replicas": 1,
        "subComponentType": "decode"
      },
      "prefill": {
        "componentType": "worker",
        "extraPodSpec": {
          "mainContainer": {
            "args": [
              "--model-path",
              "nvidia/Llama-3.1-8B-Instruct-FP8",
              "--model-name",
              "nvidia/Llama-3.1-8B-Instruct-FP8",
              "--speedup-ratio",
              "1.0",
              "--planner-profile-data",
              "/workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D",
              "--disaggregation-mode",
              "prefill"
            ],
            "command": [
              "python3",
              "-m",
              "dynamo.mocker"
            ],
            "env": [
              {
                "name": "TOKIO_WORKER_THREADS",
                "value": "2"
              },
              {
                "name": "OMP_NUM_THREADS",
                "value": "1"
              }
            ],
            "image": "nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.2.1",
            "imagePullPolicy": "IfNotPresent",
            "name": "",
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            },
            "workingDir": "/workspace"
          }
        },
        "replicas": 1,
        "subComponentType": "prefill"
      }
    }
  }
}
