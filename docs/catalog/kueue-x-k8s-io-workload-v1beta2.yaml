kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: kueue-x-k8s-io-workload-v1beta2
spec:
  experimental: true
  structureDefinition:
    rootComponent:
      name: workload
      kind:
        group: kueue.x-k8s.io
        version: v1beta2
        kind: Workload
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue([])
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byConditions:
                - type: Admitted
                  status: "False"
              byExpression:
                expression: object.?spec.?active.orValue(dyn(null)) != false && !object.?status.?conditions.orValue([]).exists(c, c.type == "Finished" && c.status == "True")
          running:
            - byConditions:
                - type: Admitted
                  status: "True"
                - type: PodsReady
                  status: "True"
              byExpression:
                expression: object.?spec.?active.orValue(dyn(null)) != false && !object.?status.?conditions.orValue([]).exists(c, c.type in ["Finished", "Evicted", "WaitingForReplacementPods"] && c.status == "True")
          completed:
            - byConditions:
                - type: Finished
                  status: "True"
                  reason: Succeeded
          failed:
            - byConditions:
                - type: Finished
                  status: "True"
                  reason: Failed
            - byConditions:
                - type: Finished
                  status: "True"
                  reason: FailedToStart
          suspended:
            - byExpression:
                expression: object.?spec.?active.orValue(dyn(null)) == false && !object.?status.?conditions.orValue([]).exists(c, c.type == "Finished" && c.status == "True") && !object.?status.?conditions.orValue([]).exists(c, c.type == "QuotaReserved" && c.status == "True")
      suspendDefinition:
        suspendActions:
          - write:
              path: /spec/active
            value: "false"
        resumeActions:
          - write:
              path: /spec/active
            value: "true"
  optimizationInstructions: {}
