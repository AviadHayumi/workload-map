{{- $submitterAdmission := include "karta.submitterAdmission" . | fromYaml -}}
{{- if $submitterAdmission.enabled }}
{{- if not (and .Values.operator.enabled .Values.webhook.enabled) }}
{{- fail "submitter admission requires operator.enabled and webhook.enabled" }}
{{- end }}
{{- if not (or $submitterAdmission.namespaceSelector.matchLabels $submitterAdmission.namespaceSelector.matchExpressions) }}
{{- fail "submitter admission requires an explicit namespaceSelector" }}
{{- end }}
{{- if not $submitterAdmission.resourceRules }}
{{- fail "submitter admission requires explicit resourceRules" }}
{{- end }}
{{- end }}

{{- if and .Values.operator.webhookOnly (not $submitterAdmission.enabled) }}
{{- fail "operator.webhookOnly requires submitter admission enabled" }}
{{- end }}
