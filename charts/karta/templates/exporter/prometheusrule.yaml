{{- if and .Values.exporter.enabled .Values.exporter.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
{{- $rule := .Values.exporter.prometheusRule -}}
{{- $join := $rule.joinLabels | join ", " -}}
{{/* All source observations must match one complete Pod attribution. */}}
{{- if or (empty $rule.resources) (empty $rule.levels) (empty $rule.joinLabels) -}}
{{- fail "exporter recording resources, levels, and joinLabels must not be empty; disable prometheusRule instead" -}}
{{- end -}}
{{- range $resource := $rule.resources -}}
{{- if not (has $resource (list "gpu" "cpu" "memory")) -}}
{{- fail (printf "invalid exporter recording resource %q" $resource) -}}
{{- end -}}
{{- end -}}
{{- range $level := $rule.levels -}}
{{- if not (has $level (list "workload" "component" "component_instance" "replica")) -}}
{{- fail (printf "invalid exporter recording level %q" $level) -}}
{{- end -}}
{{- end -}}
{{- $identityLabels := concat $rule.joinLabels (list "uid" "workload" "workload_kind" "workload_group" "workload_uid" "component" "component_instance" "replica") | uniq | join ", " -}}
{{- $identity := printf "max by (%s) (karta_pod_workload_info)" $identityLabels -}}
{{- $unique := printf "count by (%s) (%s) == 1" $join $identity -}}
{{- $levels := list
  (dict "suffix" "workload" "groupLeft" "workload, workload_kind, workload_group, workload_uid" "selector" "")
  (dict "suffix" "component" "groupLeft" "workload, workload_kind, workload_group, workload_uid, component" "selector" "{component!=\"<unknown>\"}")
  (dict "suffix" "component_instance" "groupLeft" "workload, workload_kind, workload_group, workload_uid, component, component_instance" "selector" "{component!=\"<unknown>\",component_instance!=\"<unknown>\"}")
  (dict "suffix" "replica" "groupLeft" "workload, workload_kind, workload_group, workload_uid, component, component_instance, replica" "selector" "{component!=\"<unknown>\",component_instance!=\"<unknown>\",replica!=\"\"}")
-}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  groups:
    - name: karta-exporter.rules
      interval: {{ $rule.interval }}
      rules:
        {{- range $level := $levels }}
        {{- if has $level.suffix $rule.levels }}
        {{- $info := printf "max by (%s, %s) ((max by (%s) (karta_pod_workload_info%s)) and on (%s) (%s))" $join $level.groupLeft $identityLabels $level.selector $join $unique }}
        {{- $joinClause := printf "* on (%s) group_left (%s) %s" $join $level.groupLeft $info }}
        {{- if has "gpu" $rule.resources }}
        - record: karta:gpu_utilization:{{ $level.suffix }}
          expr: |
            avg by (namespace, {{ $level.groupLeft }}) (
              {{ $rule.gpuUtilizationMetric }}
              {{ $joinClause }}
            )
        - record: karta:gpu_memory_used_bytes:{{ $level.suffix }}
          expr: |
            sum by (namespace, {{ $level.groupLeft }}) (
              ({{ $rule.gpuMemoryUsedMetric }} * 1048576)
              {{ $joinClause }}
            )
        - record: karta:gpu_memory_total_bytes:{{ $level.suffix }}
          expr: |
            sum by (namespace, {{ $level.groupLeft }}) (
              (({{ $rule.gpuMemoryUsedMetric }} + {{ $rule.gpuMemoryFreeMetric }}) * 1048576)
              {{ $joinClause }}
            )
        {{- end }}
        {{- if has "cpu" $rule.resources }}
        - record: karta:cpu_usage_cores:{{ $level.suffix }}
          expr: |
            sum by (namespace, {{ $level.groupLeft }}) (
              rate({{ $rule.cpuUsageMetric }}{container!=""}[{{ $rule.cpuRateWindow }}])
              {{ $joinClause }}
            )
        {{- end }}
        {{- if has "memory" $rule.resources }}
        - record: karta:memory_working_set_bytes:{{ $level.suffix }}
          expr: |
            sum by (namespace, {{ $level.groupLeft }}) (
              {{ $rule.memoryWorkingSetMetric }}{container!=""}
              {{ $joinClause }}
            )
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if has "gpu" $rule.resources }}
        # Coverage measures arriving GPU observations with unambiguous attribution.
        # It cannot detect an allocated device that sends no telemetry.
        - record: karta:join_coverage:ratio
          expr: |
            (
              count({{ $rule.gpuUtilizationMetric }}{pod!=""} * on ({{ $join }}) group_left ()
                (max by ({{ $join }}) ({{ $identity }}) and on ({{ $join }}) ({{ $unique }})))
              or (0 * count({{ $rule.gpuUtilizationMetric }}{pod!=""}))
            )
            /
            count({{ $rule.gpuUtilizationMetric }}{pod!=""})
        {{- end }}
{{- end }}
