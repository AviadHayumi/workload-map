kind: Karta
apiVersion: run.ai/v1alpha2
metadata:
  name: kubeflow-org-pytorchjob-v1
spec:
  variables:
    - name: specPytorchReplicaSpecsMasterReplicas
      expression: ([dyn(object[?"spec"][?"pytorchReplicaSpecs"][?"Master"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
    - name: specPytorchReplicaSpecsWorkerReplicas
      expression: ([dyn(object[?"spec"][?"pytorchReplicaSpecs"][?"Worker"][?"replicas"].orValue(dyn(null)))].filter(v, v != null && v != false) + [1])[0]
  structureDefinition:
    rootComponent:
      name: pytorchjob
      kind:
        group: kubeflow.org
        version: v1
        kind: PyTorchJob
      statusDefinition:
        conditionsDefinition:
          read:
            expression: object[?"status"][?"conditions"].orValue(dyn(null))
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          initializing:
            - byConditions:
                - type: Created
                  status: "True"
          running:
            - byConditions:
                - type: Running
                  status: "True"
          completed:
            - byConditions:
                - type: Succeeded
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      suspendDefinition:
        suspendActions:
          - write:
              path: /spec/runPolicy/suspend
            value: "true"
        resumeActions:
          - write:
              path: /spec/runPolicy/suspend
            value: "false"
    childComponents:
      - name: master
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpec:
            read:
              expression: object[?"spec"][?"pytorchReplicaSpecs"][?"Master"][?"template"].orValue(dyn(null))
            write:
              path: /spec/pytorchReplicaSpecs/Master/template
        scaleDefinition:
          replicas:
            read:
              expression: variables.specPytorchReplicaSpecsMasterReplicas
            write:
              path: /spec/pytorchReplicaSpecs/Master/replicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"training.kubeflow.org/replica-type"].orValue(dyn(null))
            value: master
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpec:
            read:
              expression: object[?"spec"][?"pytorchReplicaSpecs"][?"Worker"][?"template"].orValue(dyn(null))
            write:
              path: /spec/pytorchReplicaSpecs/Worker/template
        scaleDefinition:
          replicas:
            read:
              expression: variables.specPytorchReplicaSpecsWorkerReplicas
            write:
              path: /spec/pytorchReplicaSpecs/Worker/replicas
          minReplicas:
            read:
              expression: object[?"spec"][?"elasticPolicy"][?"minReplicas"].orValue(dyn(null))
            write:
              path: /spec/elasticPolicy/minReplicas
          maxReplicas:
            read:
              expression: object[?"spec"][?"elasticPolicy"][?"maxReplicas"].orValue(dyn(null))
            write:
              path: /spec/elasticPolicy/maxReplicas
        podSelector:
          componentTypeSelector:
            read:
              expression: object[?"metadata"][?"labels"][?"training.kubeflow.org/replica-type"].orValue(dyn(null))
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: master
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"training.kubeflow.org/job-name"].orValue(dyn(null))
            - componentName: worker
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"training.kubeflow.org/job-name"].orValue(dyn(null))
