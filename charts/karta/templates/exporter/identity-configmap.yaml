{{- if and .Values.exporter.enabled .Values.exporter.attribution.enabled }}
{{- if not .Values.exporter.attribution.rules }}
{{- fail "exporter.attribution.rules must contain at least one CEL rule" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}-identity
  namespace: {{ .Release.Namespace }}
data:
  rules.json: {{ dict "rules" .Values.exporter.attribution.rules | toJson | quote }}
{{- end }}
