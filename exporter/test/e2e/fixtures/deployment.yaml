{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "matrix-deployment"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "matrix-deployment"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "matrix-deployment"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "worker",
            "image": "busybox:1.36",
            "command": [
              "sleep",
              "600"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              }
            }
          }
        ],
        "terminationGracePeriodSeconds": 0
      }
    }
  }
}
