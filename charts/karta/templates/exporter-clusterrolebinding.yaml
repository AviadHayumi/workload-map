{{- if and .Values.exporter.enabled .Values.exporter.kartaDefinitionSource.cluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karta.exporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "karta.exporter.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
