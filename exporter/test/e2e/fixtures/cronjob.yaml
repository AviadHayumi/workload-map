{
  "apiVersion": "batch/v1",
  "kind": "CronJob",
  "metadata": {
    "name": "matrix-cronjob"
  },
  "spec": {
    "schedule": "* * * * *",
    "concurrencyPolicy": "Forbid",
    "successfulJobsHistoryLimit": 1,
    "jobTemplate": {
      "spec": {
        "backoffLimit": 0,
        "template": {
          "metadata": {
            "labels": {
              "app": "matrix-cronjob"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "worker",
                "image": "busybox:1.36",
                "command": [
                  "true"
                ],
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "16Mi"
                  }
                }
              }
            ],
            "terminationGracePeriodSeconds": 0,
            "restartPolicy": "Never"
          }
        }
      }
    }
  }
}
