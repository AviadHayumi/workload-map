{{- if .Values.exporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.exporter.replicaCount }}
  selector:
    matchLabels:
      {{- include "karta.exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karta.exporter.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "karta.exporter.config" . | sha256sum }}
        {{- if (eq (include "karta.exporter.attributionEnabled" .) "true") }}
        checksum/identity: {{ include "karta.exporter.identityConfig" . | sha256sum }}
        {{- end }}
        {{- with .Values.exporter.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "karta.exporter.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.exporter.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - --config=/etc/karta/exporter/config.json
            - --metrics-bind-address=:{{ .Values.exporter.http.port }}
            {{- if (eq (include "karta.exporter.attributionEnabled" .) "true") }}
            - --identity-config=/etc/karta/identity/rules.json
            {{- end }}
            - --metrics-exporter={{ .Values.exporter.metricsExporter }}
            {{- if eq .Values.exporter.metricsExporter "otlp" }}
            - {{ printf "--otlp-interval=%s" .Values.exporter.otlp.interval | quote }}
            - {{ printf "--otlp-timeout=%s" .Values.exporter.otlp.timeout | quote }}
            {{- end }}
            - --workload-phases={{ .Values.exporter.metrics.workloadPhases | join "," }}
          {{- if eq .Values.exporter.metricsExporter "otlp" }}
          env:
            - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
              value: {{ .Values.exporter.otlp.protocol | quote }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ .Values.exporter.otlp.endpoint | quote }}
            {{- with .Values.exporter.otlp.headersSecretRef }}
            - name: OTEL_EXPORTER_OTLP_METRICS_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- with .Values.exporter.otlp.tls.caSecretRef }}
            - name: OTEL_EXPORTER_OTLP_METRICS_CERTIFICATE
              value: /etc/karta/otlp/ca.crt
            {{- end }}
            {{- with .Values.exporter.otlp.tls.clientCertSecretRef }}
            - name: OTEL_EXPORTER_OTLP_METRICS_CLIENT_CERTIFICATE
              value: /etc/karta/otlp/client.crt
            {{- end }}
            {{- with .Values.exporter.otlp.tls.clientKeySecretRef }}
            - name: OTEL_EXPORTER_OTLP_METRICS_CLIENT_KEY
              value: /etc/karta/otlp/client.key
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/karta/exporter
              readOnly: true
            {{- if (eq (include "karta.exporter.attributionEnabled" .) "true") }}
            - name: identity
              mountPath: /etc/karta/identity
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.exporter.metricsExporter "otlp") (or .Values.exporter.otlp.tls.caSecretRef .Values.exporter.otlp.tls.clientCertSecretRef) }}
            - name: otlp-tls
              mountPath: /etc/karta/otlp
              readOnly: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.http.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.exporter.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "karta.exporter.fullname" . }}-config
        {{- if (eq (include "karta.exporter.attributionEnabled" .) "true") }}
        - name: identity
          configMap:
            name: {{ include "karta.exporter.fullname" . }}-identity
        {{- end }}
        {{- if and (eq .Values.exporter.metricsExporter "otlp") (or .Values.exporter.otlp.tls.caSecretRef .Values.exporter.otlp.tls.clientCertSecretRef) }}
        - name: otlp-tls
          projected:
            sources:
              {{- with .Values.exporter.otlp.tls.caSecretRef }}
              - secret:
                  name: {{ .name | quote }}
                  items:
                    - key: {{ .key | quote }}
                      path: ca.crt
              {{- end }}
              {{- with .Values.exporter.otlp.tls.clientCertSecretRef }}
              - secret:
                  name: {{ .name | quote }}
                  items:
                    - key: {{ .key | quote }}
                      path: client.crt
              {{- end }}
              {{- with .Values.exporter.otlp.tls.clientKeySecretRef }}
              - secret:
                  name: {{ .name | quote }}
                  items:
                    - key: {{ .key | quote }}
                      path: client.key
              {{- end }}
        {{- end }}
      {{- with .Values.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
