# The CPU mocker fixture expressed through the pinned operator's v1beta1 API.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: karta-e2e-dynamo
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.2.1
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 500m, memory: 512Mi}
                limits: {cpu: 500m, memory: 512Mi}
    - name: decode
      type: decode
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.2.1
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests: {cpu: 500m, memory: 512Mi}
                limits: {cpu: 500m, memory: 512Mi}
              workingDir: /workspace
              command: ["python3", "-m", "dynamo.mocker"]
              args:
                - --model-path
                - nvidia/Llama-3.1-8B-Instruct-FP8
                - --model-name
                - nvidia/Llama-3.1-8B-Instruct-FP8
                - --speedup-ratio
                - "1.0"
                - --planner-profile-data
                - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D
