{{- $submitterAdmission := include "karta.submitterAdmission" . | fromYaml -}}
{{- if and .Values.operator.enabled .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "karta.webhook.validatingConfigName" . }}
  {{- if and (eq .Values.webhook.cert.provisionMode "manual") .Values.webhook.cert.annotations }}
  annotations:
    {{- toYaml .Values.webhook.cert.annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
webhooks:
  {{- if not .Values.operator.webhookOnly }}
  - name: vkarta.run.ai
    admissionReviewVersions: ["v1"]
    failurePolicy: Fail
    sideEffects: None
    matchPolicy: Equivalent
    timeoutSeconds: 5
    rules:
      - apiGroups: ["run.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["kartas"]
        scope: "*"
    clientConfig:
      {{- if and (eq .Values.webhook.cert.provisionMode "manual") .Values.webhook.cert.caBundle }}
      caBundle: {{ .Values.webhook.cert.caBundle }}
      {{- end }}
      service:
        name: {{ include "karta.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-run-ai-v1alpha1-karta
        port: 443
  {{- end }}
  {{- if $submitterAdmission.enabled }}
  - name: submitter.validate.karta.run.ai
    admissionReviewVersions: ["v1"]
    failurePolicy: Fail
    sideEffects: None
    matchPolicy: Equivalent
    timeoutSeconds: 5
    namespaceSelector:
      {{- toYaml $submitterAdmission.namespaceSelector | nindent 6 }}
    {{- with $submitterAdmission.matchConditions }}
    matchConditions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    rules:
      {{- range $submitterAdmission.resourceRules }}
      - apiGroups: {{ toJson .apiGroups }}
        apiVersions: {{ toJson .apiVersions }}
        operations: ["UPDATE"]
        resources: {{ toJson .resources }}
        scope: Namespaced
      {{- end }}
    clientConfig:
      {{- if and (eq .Values.webhook.cert.provisionMode "manual") .Values.webhook.cert.caBundle }}
      caBundle: {{ .Values.webhook.cert.caBundle }}
      {{- end }}
      service:
        name: {{ include "karta.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-submitter
        port: 443
  {{- end }}
{{- end -}}
