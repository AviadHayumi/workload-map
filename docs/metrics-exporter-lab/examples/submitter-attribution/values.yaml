exporter:
  enabled: true
  kartaDefinitionSource:
    catalog:
      enabled: true
  attribution:
    submittedByExpression: |
      ("workload.dgxc.nvidia.com/submitter-id" in annotations &&
       annotations["workload.dgxc.nvidia.com/submitter-id"] != "")
        ? annotations["workload.dgxc.nvidia.com/submitter-id"]
        : ("karta.run.ai/submitted-by" in annotations &&
           annotations["karta.run.ai/submitted-by"] != "")
          ? annotations["karta.run.ai/submitted-by"]
          : ("osmo.submitted_by" in labels
              ? labels["osmo.submitted_by"] : "")

submitterAdmission:
  enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        karta.run.ai/capture-submitter: "true"
