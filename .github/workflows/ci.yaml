name: Pull Request

on:
  push:
    branches:
      - main
      - "v[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
      - "v[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # pin-check compares the pin against the release tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum
            hack/release/go.sum

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Cache bin tools
        uses: actions/cache@v6
        with:
          path: |
            bin/controller-gen-*
            bin/go-licence-detector-*
            bin/golangci-lint-*
            bin/goreleaser-*
            bin/setup-envtest-*
            bin/k8s
          key: ${{ runner.os }}-tools-v1-${{ hashFiles('Makefile') }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-tools-v1-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-tools-v1-

      - name: Validate GoReleaser configuration
        run: make goreleaser-check

      - name: Check the synchronized pin
        if: github.event_name == 'pull_request'
        run: make pin-check

      - name: Run checks and build release executables
        run: |
          build_version="0.0.0-main-${GITHUB_SHA:0:7}"
          make check VERSION="$build_version"

      - name: Lint helm chart
        run: make helm-lint

      - name: Validate helm chart renders
        run: make helm-validate

      - name: Verify air-gap image lock coverage
        run: make image-lock-verify

      - name: Test air-gap image lock generator
        run: make image-lock-test

      - name: Lint shell scripts
        run: make lint-shell

  operator-e2e:
    name: Operator E2E (${{ matrix.webhook }})
    # Every push, and a pull request that changes the Karta operator install,
    # chart or image.
    needs: e2e-install-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.e2e-install-changes.outputs.karta == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        webhook: [auto, cert-manager, disabled]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            operator/go.sum

      - name: Read pinned tool versions
        run: |
          . ./hack/e2e/global.env
          echo "KIND_VERSION=$KIND_VERSION" >> "$GITHUB_ENV"
          echo "KUBECTL_VERSION=$KUBECTL_VERSION" >> "$GITHUB_ENV"

      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}

      - name: Provision cluster
        run: make e2e-up WORKLOADS=none KARTA_WEBHOOK_MODE=${{ matrix.webhook }}

      - name: Run operator e2e
        run: make test-operator-e2e KARTA_WEBHOOK_MODE=${{ matrix.webhook }}

      - name: Collect diagnostics
        if: failure()
        run: kind export logs .artifacts/kind --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-e2e-artifacts-${{ matrix.webhook }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: make e2e-down

  e2e-install-changes:
    name: Operator install changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      operators: ${{ steps.detect.outputs.operators }}
      karta: ${{ steps.detect.outputs.karta }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The detector diffs the pull request against its base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect operators whose install changed
        id: detect
        # bash here means pipefail, so a detector failure fails the step
        # instead of leaving tee to report success with empty outputs.
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./hack/e2e/changed-operators.sh "origin/${BASE_REF}" | tee -a "$GITHUB_OUTPUT"

  operator-install:
    name: Operator install (${{ matrix.operator }})
    needs: e2e-install-changes
    if: github.event_name == 'pull_request' && needs.e2e-install-changes.outputs.operators != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        operator: ${{ fromJSON(needs.e2e-install-changes.outputs.operators) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        run: |
          . ./hack/e2e/global.env
          {
            echo "KIND_VERSION=$KIND_VERSION"
            echo "KUBECTL_VERSION=$KUBECTL_VERSION"
            echo "HELM_VERSION=$HELM_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}

      # A fresh cluster is the only place an install script proves itself:
      # namespaces the manifest does not ship, CRDs that must exist before a
      # controller starts, webhooks that must be ready before their objects.
      - name: Install the operator on a fresh cluster
        env:
          OPERATOR: ${{ matrix.operator }}
        run: make e2e-up WORKLOADS="$OPERATOR"

      - name: Collect diagnostics
        if: failure()
        run: kind export logs .artifacts/kind --name karta-e2e || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-install-artifacts-${{ matrix.operator }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: make e2e-down

  # One fixed-name check for branch protection: the matrix job names vary per
  # operator and a skipped matrix must still count as green.
  e2e-install-gate:
    name: Operator install gate
    needs: [e2e-install-changes, operator-install, operator-e2e]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail unless every selected install passed
        env:
          DETECT: ${{ needs.e2e-install-changes.result }}
          INSTALL: ${{ needs.operator-install.result }}
          KARTA: ${{ needs.operator-e2e.result }}
        run: |
          echo "detector=${DETECT} operator-install=${INSTALL} operator-e2e=${KARTA}"
          [ "${DETECT}" = "success" ] || exit 1
          case "${INSTALL}" in success|skipped) ;; *) exit 1 ;; esac
          case "${KARTA}" in success|skipped) ;; *) exit 1 ;; esac

  headlamp-plugin-ci:
    name: Headlamp Plugin Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Headlamp plugin
        run: make headlamp-plugin-build
